<head>

<style>:root{--bg:#14100d;--sf:#1f1812;--sf2:#2a2018;--tx:#f3e6d3;--mu:#b39b82;--pk:#e07a2f;--gd:#d9a441;--cr:#b3263e;--sg:#6f8f5e;--pl:#8a5a8f;--ln:#3a2d22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Nunito Sans',system-ui,sans-serif;font-size:16px;line-height:1.4;overflow-x:hidden}

.teams{display:flex;gap:8px;justify-content:center;align-items:stretch;margin-top:10px}
.tm{flex:1;border-radius:12px;padding:6px 8px;font-weight:800;border:2px solid var(--ln)}
.tm .n{font-size:12px;font-weight:600;opacity:.9}

#cdbar{background:var(--sf2);color:var(--gd);text-align:center;font-weight:800;padding:8px;font-size:14px}
nav{display:flex;overflow-x:auto;background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:4}
.tab{flex:1;min-width:58px;min-height:46px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font:800 14px 'Nunito Sans',sans-serif}
.tab.active{color:var(--gd);border-bottom-color:var(--pk)}
main{padding:12px 12px 90px;max-width:560px;margin:0 auto}
.loader{text-align:center;color:var(--mu);padding:40px;letter-spacing:3px;font-weight:800}

button.btn,.btn{min-height:46px;padding:0 16px;border-radius:12px;border:0;background:var(--pk);color:#1b0f05;font:800 15px 'Nunito Sans',sans-serif}

.pill.g{border-color:var(--sg);color:#cde5bd}.pill.o{border-color:var(--pk);color:#ffd2a8}.pill.r{border-color:var(--cr);color:#ffb7c2}

details[open]{padding-bottom:10px}

<header>
  <div class="ttl"><span class="pie">🥧</span> PIE WARS</div>

<div id="toast"></div>
<div id="adminOverlay"><div class="admbox"><div id="adminBody"></div></div></div>
<script>
/* PIE WARS ENGINE: pure logic, no DOM, no network.
   Decisions (confirmed with Michael, Sat Nov 14 2026):
   D1 w=0.85 (admin setting) | D2 rest = today or future, before steps entered | D3 every matchup +3
   D4 bingo rows only + blackout | D5 personal 4-digit codes | D6 inventories + Shield public
   D7 equal thirds | D8 store small bingo photos | D9 round closes on full entry or admin CLOSE ROUND
   D10 baselines seeded from the 13th Floor averages, frozen at setup. */
'use strict';
const TZ='America/Chicago';
const CHALLENGE_ID='pie-wars';
const _fmt=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
function chi(now){
  const p={};
  _fmt.formatToParts(now||new Date()).forEach(x=>{p[x.type]=x.value;});
  return {date:p.year+'-'+p.month+'-'+p.day,h:(+p.hour)%24,m:+p.minute,s:+p.second};
}
function _pad(n){return String(n).padStart(2,'0');}
function addDays(d,n){
  const [y,m,dd]=d.split('-').map(Number);
  const t=new Date(Date.UTC(y,m-1,dd)+n*864e5);
  return t.getUTCFullYear()+'-'+_pad(t.getUTCMonth()+1)+'-'+_pad(t.getUTCDate());
}
function dayDiff(a,b){
  const pa=a.split('-').map(Number),pb=b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/864e5);
}
function dateRange(a,b){const out=[];for(let d=a;d<=b;d=addDays(d,1))out.push(d);return out;}
function atOrAfter(now,date,hour){const c=chi(now);return c.date>date||(c.date===date&&c.h>=hour);}
function fmtDay(d){const [,m,dd]=d.split('-').map(Number);return m+'/'+dd;}

/* ---------- constants ---------- */
const PIDS=['michael','jordan','lauren','allen','chris','kaykay','meghan','shania'];
const NAMES={michael:'Michael',jordan:'Jordan',lauren:'Lauren',allen:'Allen',chris:'Chris',kaykay:'KayKay',meghan:'Meghan',shania:'Shania'};
const DEFAULT_PREV_AVG={shania:17789,allen:17146,michael:14245,jordan:12366,kaykay:11877,chris:11442,lauren:8461,meghan:6598};
const PIE_BY_SEED=['Pumpkin','Pecan','Apple','Sweet Potato','Cherry','Key Lime','Chocolate Silk','Banana Cream'];
const TYPES=['butter','steal','shield'];
const MATCH_LABEL={qf1:'Quarterfinal',qf2:'Quarterfinal',qf3:'Quarterfinal',qf4:'Quarterfinal',sfw1:'Semifinal',sfw2:'Semifinal',sfc1:'Consolation semi',sfc2:'Consolation semi',final:'Championship',third:'3rd place',fifth:'5th place',seventh:'7th place'};
const MAX_STEPS=150000;

function defConfig(){
  return {start:'2026-11-14',end:'2026-11-26',w:0.85,mult:2,cap:150,floor:0,butter:1.25,steal:15,restDays:1,
    roundDates:null,drawWeights:{butter:1,steal:1,shield:1},teamA:'Feast Mode'};
}
function seedsFrom(prevAvg){
  const order=[...PIDS].sort((a,b)=>(prevAvg[b]-prevAvg[a])||(PIDS.indexOf(a)-PIDS.indexOf(b)));
  const seed={};order.forEach((p,i)=>{seed[p]=i+1;});return seed;
}
function groupAvg(prevAvg){return Math.round(PIDS.reduce((t,p)=>t+prevAvg[p],0)/PIDS.length);}
function baselinesFrom(prevAvg,w){
  const g=groupAvg(prevAvg),b={};
  PIDS.forEach(p=>{b[p]=Math.round(w*prevAvg[p]+(1-w)*g);});return b;
}
function makeSetup(prevAvg,w){
  prevAvg=Object.assign({},prevAvg||DEFAULT_PREV_AVG);
  const seed=seedsFrom(prevAvg),team={},pie={};
  PIDS.forEach(p=>{team[p]=[1,4,6,7].includes(seed[p])?'A':'B';pie[p]=PIE_BY_SEED[seed[p]-1];});
  return {prevAvg,group:groupAvg(prevAvg),w,baseline:baselinesFrom(prevAvg,w),seed,team,
    teamNames:{A:'Feast Mode',B:'Sweat Potatoes'},pieNames:pie};
}

/* ---------- bingo card (data, editable in admin). FREE sits in the center (index 12). ---------- */
function defSquares(){
  const T=[
    ['Walk with a kid or a pet','photo'],['A day at 120% of your baseline','auto',{kind:'pct',min:120}],['Sunset walk','photo'],
    ['Walk in the rain','photo'],['New route','photo'],['30-minute workout','photo'],
    ['3 days in a row at or above baseline','auto',{kind:'streak',days:3,min:100}],
    ['Walk before 7am (tracker screenshot)','photo'],
    ['Bounce back: 100% the day after a day under 90%','auto',{kind:'bounce'}],
    ['Walk with a family member','photo'],['Call someone you have not talked to in a month','honor'],
    ['Stairs instead of the elevator all day','honor'],
    ['FREE','free'],
    ['Take a pie to someone, walking','photo'],['Park far away on purpose','honor'],
    ['A day at 150% of your baseline','auto',{kind:'pct',min:150}],
    ['Two days in a row at 110% of baseline','auto',{kind:'streak',days:2,min:110}],
    ['Turkey, squirrel or deer sighting','photo'],['Walk in a different park','photo'],
    ['Walk while listening to a full podcast episode','honor'],
    ['Match your best day so far within 5%','auto',{kind:'bestmatch',tol:5}],
    ['Hit baseline on a power-up day','auto',{kind:'powerday'}],
    ['Walk after dinner','photo'],['Pick up trash on a walk','photo'],
    ['Thanksgiving morning walk (claimable Nov 26)','photo',null,'2026-11-26']
  ];
  return T.map((t,i)=>({id:i,text:t[0],type:t[1],rule:t[2]||null,minDate:t[3]||null}));
}

function defState(){
  const players={};PIDS.forEach(p=>{players[p]={steps:{},code:'1111'};});
  return {version:1,challenge:CHALLENGE_ID,epoch:'e'+Date.now().toString(36),config:defConfig(),players,entryAt:{},
    setup:makeSetup(DEFAULT_PREV_AVG,0.85),rest:{},plays:[],awards:[],goals:{},rounds:{},hold:{},coin:{},
    bingo:{squares:defSquares(),claims:{}},history:[],lastBackupAt:null};
}
function clone(o){return JSON.parse(JSON.stringify(o));}
function ensureShape(s){
  const d=defState();
  s=s||{};
  s.version=s.version||1;s.challenge=CHALLENGE_ID;s.epoch=s.epoch||d.epoch;
  s.config=Object.assign(defConfig(),s.config||{});
  s.config.drawWeights=Object.assign({butter:1,steal:1,shield:1},s.config.drawWeights||{});
  s.setup=s.setup||d.setup;
  s.players=s.players||{};
  PIDS.forEach(p=>{const q=s.players[p]=s.players[p]||{};q.steps=q.steps||{};q.code=q.code||'1111';});
  ['entryAt','rest','goals','rounds','hold','coin'].forEach(k=>{s[k]=s[k]||{};});
  ['plays','awards','history'].forEach(k=>{s[k]=s[k]||[];});
  s.bingo=s.bingo||{};s.bingo.squares=s.bingo.squares||defSquares();s.bingo.claims=s.bingo.claims||{};
  s.lastBackupAt=s.lastBackupAt||null;
  return s;
}
function hist(S,who,what,now){
  S.history.push({at:(now||new Date()).toISOString(),who:who||'?',what});
  if(S.history.length>500)S.history.splice(0,S.history.length-500);
}

/* ---------- rounds ---------- */
function roundSplit(n){const base=Math.floor(n/3),rem=n%3;return [base,base+(rem>=2?1:0),base+(rem>=1?1:0)];}
function roundDates(S){
  const c=S.config;
  if(Array.isArray(c.roundDates)&&c.roundDates.length===3)return c.roundDates.map(r=>[r[0],r[1]]);
  const n=dayDiff(c.start,c.end)+1,L=roundSplit(n),out=[];let s=c.start;
  L.forEach(len=>{out.push([s,addDays(s,len-1)]);s=addDays(s,len);});
  return out;
}
function roundIndex(S,date){
  const R=roundDates(S);
  for(let i=0;i<3;i++)if(date>=R[i][0]&&date<=R[i][1])return i+1;
  return 0;
}
function roundDateList(S,r){const R=roundDates(S)[r-1];return dateRange(R[0],R[1]);}
function isClosedDate(S,date){const r=roundIndex(S,date);return !!(r&&S.rounds[r]);}
function seedList(S){return [...PIDS].sort((a,b)=>S.setup.seed[a]-S.setup.seed[b]);}

function matchupsForRound(S,r){
  if(r===1){
    const q=seedList(S);
    return [['qf1',q[0],q[7]],['qf2',q[1],q[6]],['qf3',q[2],q[5]],['qf4',q[3],q[4]]].map(m=>({id:m[0],bracket:m[0].slice(0,2)==='qf'?'W':'W',a:m[1],b:m[2]}));
  }
  const prev=S.rounds[r-1];
  if(!prev)return null;
  const M={};prev.matches.forEach(m=>{M[m.id]=m;});
  const need=r===2?['qf1','qf2','qf3','qf4']:['sfw1','sfw2','sfc1','sfc2'];
  if(!need.every(id=>M[id]&&M[id].winner))return null;
  const W=id=>M[id].winner,L=id=>M[id].winner===M[id].a?M[id].b:M[id].a;
  if(r===2)return [
    {id:'sfw1',bracket:'W',a:W('qf1'),b:W('qf4')},{id:'sfw2',bracket:'W',a:W('qf2'),b:W('qf3')},
    {id:'sfc1',bracket:'C',a:L('qf1'),b:L('qf4')},{id:'sfc2',bracket:'C',a:L('qf2'),b:L('qf3')}];
  return [
    {id:'final',bracket:'W',a:W('sfw1'),b:W('sfw2'),place:1},{id:'third',bracket:'W',a:L('sfw1'),b:L('sfw2'),place:3},
    {id:'fifth',bracket:'C',a:W('sfc1'),b:W('sfc2'),place:5},{id:'seventh',bracket:'C',a:L('sfc1'),b:L('sfc2'),place:7}];
}
function opponentOf(S,pid,date){
  const r=roundIndex(S,date);if(!r)return null;
  const ms=S.rounds[r]?S.rounds[r].matches:matchupsForRound(S,r);
  if(!ms)return null;
  const m=ms.find(x=>x.a===pid||x.b===pid);
  return m?(m.a===pid?m.b:m.a):null;
}

/* ---------- plays, awards, inventory ---------- */
function restHit(S,p){return S.rest[p.pid]===p.date||(p.type==='steal'&&p.target&&S.rest[p.target]===p.date);}
// a play "counts" (is spent and has effect) when it is ok, not voided, and no rest day cancels it
function playEffective(S,p){return p.status==='ok'&&!restHit(S,p);}
// a play is "spent" (uses up the item): effective plays, plus blocked steals (unless the stealer rested)
function playSpent(S,p){
  if(p.status==='ok')return !restHit(S,p);
  if(p.status==='blocked')return S.rest[p.pid]!==p.date;
  return false;
}
function awardType(a){return a.voided?null:a.type;}
function inventory(S,pid){
  const inv={butter:0,steal:0,shield:0};
  S.awards.forEach(a=>{if(a.pid===pid&&!a.voided&&a.type&&inv[a.type]!=null)inv[a.type]++;});
  S.plays.forEach(p=>{
    if(p.pid===pid&&playSpent(S,p)&&inv[p.type]!=null)inv[p.type]--;
    if(p.status==='blocked'&&p.target===pid&&S.rest[p.pid]!==p.date)inv.shield--;   // a blocked steal consumed this Shield
  });
  TYPES.forEach(t=>{if(inv[t]<0)inv[t]=0;});
  return inv;
}
function pendingChoices(S,pid){return S.awards.filter(a=>a.pid===pid&&a.choice&&!a.type&&!a.voided);}
function playOn(S,pid,date){return S.plays.find(p=>p.pid===pid&&p.date===date&&playSpent(S,p))||null;}

function playPowerup(S,pid,type,date,now){
  if(type!=='butter'&&type!=='steal')throw new Error('Only Extra Butter and Steal a Slice can be played.');
  const today=chi(now).date;
  if(!(today<date))throw new Error('Power-ups must be played before the day they apply to begins.');
  if(date<S.config.start||date>S.config.end)throw new Error('That date is outside the challenge.');
  if(isClosedDate(S,date))throw new Error('That round is closed.');
  if(S.rest[pid]===date)throw new Error('That is your rest day.');
  if(playOn(S,pid,date))throw new Error('You already played a power-up for '+fmtDay(date)+'.');
  if(inventory(S,pid)[type]<1)throw new Error('You do not have that power-up.');
  const play={id:'play-'+pid+'-'+date+'-'+type+'-'+(S.plays.length+1),pid,type,date,target:null,at:now.toISOString(),status:'ok'};
  if(type==='steal'){
    const opp=opponentOf(S,pid,date);
    if(!opp)throw new Error('Your opponent for '+fmtDay(date)+' is not known yet.');
    if(S.rest[opp]===date)throw new Error(NAMES[opp]+' is resting that day.');
    play.target=opp;
    if(inventory(S,opp).shield>0){play.status='blocked';}
  }
  S.plays.push(play);
  hist(S,pid,(play.status==='blocked'?'STEAL BLOCKED by Shield':'play '+type)+' for '+date+(play.target?' vs '+play.target:''),now);
  return play;
}
function voidPlay(S,id,now){
  const p=S.plays.find(x=>x.id===id);if(!p)throw new Error('Play not found.');
  if(p.status==='void')throw new Error('Already voided.');
  p.status='void';hist(S,'admin','void play '+id,now);return p;
}

/* ---------- logging steps & rest ---------- */
function logError(S,pid,date,steps,now,admin){
  if(!PIDS.includes(pid))return 'Choose your name.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return 'Choose a date.';
  if(date<S.config.start||date>S.config.end)return 'That date is outside the challenge ('+fmtDay(S.config.start)+' to '+fmtDay(S.config.end)+').';
  if(!admin&&date>=chi(now).date)return 'Steps can only be entered for days before today.';
  if(isClosedDate(S,date))return 'This round is closed. Ask Michael to reopen it.';
  if(S.rest[pid]===date)return 'That is '+NAMES[pid]+'\'s rest day. No steps to enter.';
  if(typeof steps!=='number'||!isFinite(steps)||steps%1!==0)return 'Enter a whole number of steps.';
  if(steps<0||steps>MAX_STEPS)return 'Steps must be between 0 and '+MAX_STEPS.toLocaleString('en-US')+'.';
  return null;
}
function stepWarnings(S,pid,date,steps){
  const w=[],avg=S.setup.prevAvg[pid];
  if(steps>avg*2.5)w.push('That is more than 2.5x '+NAMES[pid]+'\'s usual ('+Math.round(avg).toLocaleString('en-US')+').');
  if(steps<avg*0.3)w.push('That is under 30% of '+NAMES[pid]+'\'s usual ('+Math.round(avg).toLocaleString('en-US')+').');
  PIDS.forEach(o=>{if(o!==pid&&steps>0&&S.players[o].steps[date]===steps)w.push('That exactly matches '+NAMES[o]+'\'s total for '+fmtDay(date)+'.');});
  return w;
}
function logSteps(S,pid,date,steps,now,opts){
  opts=opts||{};
  const e=logError(S,pid,date,steps,now,opts.admin);if(e)throw new Error(e);
  const had=S.players[pid].steps[date];
  S.players[pid].steps[date]=steps;
  S.entryAt[pid]=S.entryAt[pid]||{};
  if(!S.entryAt[pid][date])S.entryAt[pid][date]=now.toISOString();   // edits keep the first timestamp
  hist(S,opts.admin?'admin':pid,(had==null?'log ':'edit ')+pid+' '+date+' = '+steps+(had!=null?' (was '+had+')':''),now);
}
function clearSteps(S,pid,date,now){
  if(isClosedDate(S,date))throw new Error('This round is closed. Ask Michael to reopen it.');
  delete S.players[pid].steps[date];if(S.entryAt[pid])delete S.entryAt[pid][date];
  hist(S,'admin','clear '+pid+' '+date,now);
}
function claimRest(S,pid,date,now,opts){
  opts=opts||{};
  const today=chi(now).date;
  if(date<S.config.start||date>S.config.end)throw new Error('That date is outside the challenge.');
  if(!opts.admin&&date<today)throw new Error('A rest day must be today or a future date.');
  if(isClosedDate(S,date))throw new Error('That round is closed.');
  if(S.players[pid].steps[date]!=null)throw new Error('Steps are already entered for '+fmtDay(date)+'. The rest day is locked.');
  if(S.rest[pid]&&!opts.admin)throw new Error('You already used your rest day ('+fmtDay(S.rest[pid])+').');
  S.rest[pid]=date;
  hist(S,opts.admin?'admin':pid,'rest day '+pid+' '+date,now);
  return date;
}
function clearRest(S,pid,now){delete S.rest[pid];hist(S,'admin','clear rest '+pid,now);}

/* ---------- daily scoring (derived, never stored) ---------- */
function baseScore(S,pct){
  const c=S.config;
  return pct>=100?pct:100-c.mult*(100-pct);
}
function dayScores(S,date,fill){
  const c=S.config,out={};
  PIDS.forEach(pid=>{
    if(S.rest[pid]===date){out[pid]={rest:true};return;}
    let st=S.players[pid].steps[date];
    if(st==null){if(!fill){out[pid]={pending:true};return;}st=0;}
    const base=S.setup.baseline[pid],pct=st/base*100;
    let s=baseScore(S,pct);
    const butter=S.plays.some(p=>p.pid===pid&&p.date===date&&p.type==='butter'&&playEffective(S,p));
    if(butter)s*=c.butter;
    out[pid]={steps:st,pct,butter,pre:s,raw:s,gain:0,loss:0,steal:null,missing:S.players[pid].steps[date]==null};
  });
  S.plays.forEach(p=>{
    if(p.type!=='steal'||p.date!==date||!playEffective(S,p))return;
    const A=out[p.pid],B=out[p.target];
    if(!A||!B||A.rest||B.rest)return;
    if(A.pending)return;
    const amt=B.pending?0:(c.steal/100)*Math.max(0,B.pre);
    A.gain+=amt;A.steal=p.target;
    if(!B.pending)B.loss+=amt;
    if(B.pending)A.partial=true;
  });
  PIDS.forEach(pid=>{
    const o=out[pid];if(o.rest||o.pending)return;
    o.raw=o.pre+o.gain-o.loss;
    o.final=Math.min(c.cap,Math.max(c.floor,o.raw));
  });
  return out;
}
function roundStats(S,r,pid,fill){
  const dates=roundDateList(S,r);let sum=0,n=0,raw=0,best=-1,entered=0;
  dates.forEach(d=>{
    const o=dayScores(S,d,fill)[pid];
    if(o.rest||o.pending)return;
    sum+=o.final;n++;raw+=o.steps;entered++;if(o.final>best)best=o.final;
  });
  return {avg:n?sum/n:0,n,raw,best:best<0?0:best,sum};
}
function roundComplete(S,r){
  const dates=roundDateList(S,r);
  return PIDS.every(pid=>dates.every(d=>S.rest[pid]===d||S.players[pid].steps[d]!=null));
}
function missingFor(S,date){return PIDS.filter(p=>S.rest[p]!==date&&S.players[p].steps[date]==null);}
const r2=x=>Math.round(x*100);

function decideMatch(S,r,m,fill){
  const A=roundStats(S,r,m.a,fill),B=roundStats(S,r,m.b,fill);
  let winner=null,how='avg';
  if(r2(A.avg)!==r2(B.avg))winner=A.avg>B.avg?m.a:m.b;
  else if(A.raw!==B.raw){winner=A.raw>B.raw?m.a:m.b;how='raw steps';}
  else if(r2(A.best)!==r2(B.best)){winner=A.best>B.best?m.a:m.b;how='best day';}
  else{const c=S.coin[r+':'+m.id];if(c===m.a||c===m.b){winner=c;how='coin flip';}}
  return {id:m.id,bracket:m.bracket,place:m.place||null,a:m.a,b:m.b,aAvg:A.avg,bAvg:B.avg,aRaw:A.raw,bRaw:B.raw,winner,how};
}
function closeRound(S,r,now,forced){
  if(S.rounds[r])return 'closed';
  if(r>1&&!S.rounds[r-1])return 'wait';
  if(S.hold[r]&&!forced)return 'hold';
  const R=roundDates(S)[r-1];
  if(!forced&&!(chi(now).date>R[1]))return 'early';
  if(!forced&&!roundComplete(S,r))return 'incomplete';
  const ms=matchupsForRound(S,r);if(!ms)return 'wait';
  const res=ms.map(m=>decideMatch(S,r,m,true));
  if(res.some(m=>!m.winner))return 'tie';
  S.rounds[r]={closedAt:now.toISOString(),forced:!!forced,matches:res};
  delete S.hold[r];
  hist(S,forced?'admin':'auto','close round '+r+(forced?' (forced)':''),now);
  return 'ok';
}
function reopenRound(S,r,now){
  if(!S.rounds[r])throw new Error('Round '+r+' is not closed.');
  for(let i=r;i<=3;i++)delete S.rounds[i];
  S.hold[r]=true;
  hist(S,'admin','REOPEN round '+r+' (later rounds deleted, held)',now);
}
function releaseHold(S,r,now){delete S.hold[r];hist(S,'admin','release hold round '+r,now);}
function setCoin(S,r,matchId,pid,now){S.coin[r+':'+matchId]=pid;hist(S,'admin','coin flip '+r+':'+matchId+' -> '+pid,now);}

function placements(S){
  if(!S.rounds[3])return null;
  const out={};
  S.rounds[3].matches.forEach(m=>{const l=m.winner===m.a?m.b:m.a;out[m.winner]=m.place;out[l]=m.place+1;});
  return out;
}
function currentRound(S,now){
  for(let r=1;r<=3;r++)if(!S.rounds[r])return r;
  return 4;
}

/* ---------- teams ---------- */
function teamEvents(S){
  const ev=[],T=S.setup.team;
  for(let r=1;r<=3;r++){
    if(!S.rounds[r])continue;
    S.rounds[r].matches.forEach(m=>{
      ev.push({team:T[m.winner],pts:3,what:NAMES[m.winner]+' won '+MATCH_LABEL[m.id].toLowerCase(),at:S.rounds[r].closedAt,pid:m.winner});
      if(m.id==='final')ev.push({team:T[m.winner],pts:5,what:NAMES[m.winner]+' won the championship',at:S.rounds[r].closedAt,pid:m.winner});
    });
  }
  PIDS.forEach(pid=>{
    const b=bingoState(S,pid);
    b.rowsDone.forEach(rw=>ev.push({team:T[pid],pts:1,what:NAMES[pid]+' bingo row '+(rw+1),at:null,pid}));
    if(b.blackout)ev.push({team:T[pid],pts:3,what:NAMES[pid]+' BLACKOUT',at:null,pid});
  });
  return ev;
}
function teamTotals(S){
  const t={A:0,B:0};teamEvents(S).forEach(e=>{t[e.team]+=e.pts;});return t;
}
function teamTiebreak(S){
  const t={A:0,B:0};
  for(let r=1;r<=3;r++)if(S.rounds[r])S.rounds[r].matches.forEach(m=>{t[S.setup.team[m.a]]+=m.aAvg;t[S.setup.team[m.b]]+=m.bAvg;});
  return t;
}
function teamLeader(S){
  const t=teamTotals(S);if(t.A!==t.B)return t.A>t.B?'A':'B';
  const k=teamTiebreak(S);if(r2(k.A)!==r2(k.B))return k.A>k.B?'A':'B';
  return null;
}

/* ---------- goals ---------- */
function prevEntered(S,pid,date){
  const pd=addDays(date,-1);
  if(pd<S.config.start||S.rest[pid]===pd)return null;
  const v=S.players[pid].steps[pd];return v==null?null:v;
}
function entryMs(S,pid,date){const t=(S.entryAt[pid]||{})[date];return t?Date.parse(t):8.64e15;}
const GOALS=[
  /* retired: kept only so goals already revealed or resolved still display and score. Never picked for new days. */
  {id:1,retired:true,name:'Closest to exactly 12,345 steps',key:c=>-Math.abs(c.steps-12345)},
  {id:3,retired:true,name:'First to log yesterday\'s steps',key:c=>-c.entryMs},
  {id:5,retired:true,name:'Closest to your own baseline',key:c=>-Math.abs(c.day.pct-100)},
  {id:6,retired:true,name:'Closest to exactly 10,000 steps',key:c=>-Math.abs(c.steps-10000)},
  {id:8,retired:true,name:'Smallest drop from your own previous day',key:c=>c.prev==null?null:(c.steps-c.prev)},
  {id:9,retired:true,name:'Closest to the group\'s average steps for the day',key:c=>-Math.abs(c.steps-c.groupAvg)},
  {id:10,retired:true,name:'Closest to exactly 15,000 steps',key:c=>-Math.abs(c.steps-15000)},
  {id:11,retired:true,name:'Lowest daily score that still clears 100',key:c=>c.day.raw>100?-c.day.raw:null},
  {id:12,retired:true,name:'Most steps above your baseline',key:c=>c.steps-c.base},
  /* active pool: every goal rewards walking MORE relative to your own baseline or history */
  {id:2,name:'Biggest percentage jump over your own previous day',needsPrev:true,key:c=>c.prev==null||c.prev===0?null:(c.steps/c.prev-1)},
  {id:4,name:'Highest daily score',key:c=>c.day.raw},
  {id:7,name:'Highest percent of baseline',key:c=>c.day.pct},
  {id:13,name:'Highest percent of baseline with no power-up played',key:c=>c.naked?c.day.pct:null},
  {id:14,name:'Biggest beat of your own average so far',needsPrev:true,key:c=>c.earlier.length?c.day.pct-c.earlier.reduce((a,b)=>a+b,0)/c.earlier.length:null},
  {id:15,name:'New personal best (highest percent among players who set one)',needsPrev:true,key:c=>c.earlier.length&&c.day.pct>Math.max.apply(null,c.earlier)?c.day.pct:null},
  {id:16,name:'Best back-to-back: highest average percent of today and yesterday',needsPrev:true,key:c=>c.prevPct==null?null:(c.day.pct+c.prevPct)/2},
  {id:17,name:'Longest streak at or above your baseline, ending today',key:c=>c.day.pct>=100?c.streak:null},
  {id:18,name:'Biggest win over your matchup opponent today',key:c=>c.oppRaw==null?null:(c.day.raw-c.oppRaw)},
  {id:19,name:'Most improved from your first day (percent today minus your Day 1 percent)',needsPrev:true,key:c=>c.earlier.length?c.day.pct-c.earlier[0]:null},
  {id:20,name:'Team spotlight: highest percent of baseline on the featured team',key:c=>c.spot?c.day.pct:null}
];
function spotlightTeam(S,date){return dayDiff(S.config.start,date)%2===0?'A':'B';}   // alternates by day, so both teams get turns
function goalActive(g){return !g.retired;}
function earlierPcts(S,pid,date){
  const out=[];
  dateRange(S.config.start,addDays(date,-1)).forEach(d=>{if(d<S.config.start||S.rest[pid]===d)return;const v=S.players[pid].steps[d];if(v!=null)out.push(v/S.setup.baseline[pid]*100);});
  return out;
}
function streakEnding(S,pid,date){
  let n=0;
  for(let d=date;d>=S.config.start;d=addDays(d,-1)){
    if(S.rest[pid]===d)continue;
    const v=S.players[pid].steps[d];
    if(v!=null&&v/S.setup.baseline[pid]*100>=100)n++;else break;
  }
  return n;
}
function goalById(id){return GOALS.find(g=>g.id===id);}
function goalWinner(S,date,goalId){
  const g=goalById(goalId),ds=dayScores(S,date,false);
  const elig=PIDS.filter(p=>!ds[p].rest&&!ds[p].pending);
  if(!elig.length)return null;
  const gAvg=elig.reduce((t,p)=>t+ds[p].steps,0)/elig.length;
  const rows=elig.map(pid=>{
    const opp=opponentOf(S,pid,date),od=opp?ds[opp]:null,pv=prevEntered(S,pid,date);
    const c={pid,day:ds[pid],steps:ds[pid].steps,base:S.setup.baseline[pid],prev:pv,prevPct:pv==null?null:pv/S.setup.baseline[pid]*100,
      earlier:earlierPcts(S,pid,date),streak:streakEnding(S,pid,date),oppRaw:(od&&!od.rest&&!od.pending)?od.raw:null,
      entryMs:entryMs(S,pid,date),groupAvg:gAvg,naked:!playOn(S,pid,date),spot:S.setup.team[pid]===spotlightTeam(S,date)};
    return {pid,steps:c.steps,em:c.entryMs,key:g.key(c)};
  }).filter(x=>x.key!=null&&isFinite(x.key));
  if(!rows.length)return null;
  rows.sort((a,b)=>(Math.abs(b.key-a.key)>1e-9?(b.key-a.key):0)||(b.steps-a.steps)||(a.em-b.em));
  return rows[0].pid;
}
function pickGoal(S,date,rng){
  const active=GOALS.filter(goalActive),first=date===S.config.start;
  const used=Object.keys(S.goals).sort().map(d=>S.goals[d].id);
  if(first&&!used.includes(7))return 7;                       // day 1 has no history: highest percent of baseline
  const ok=g=>!(g.needsPrev&&first);
  let pool=active.filter(g=>ok(g)&&!used.includes(g.id));
  if(!pool.length){const last=used[used.length-1];pool=active.filter(g=>ok(g)&&g.id!==last);}   // pool used up: repeat, never back to back
  return pool[rng(pool.length)].id;
}
function drawType(S,rng){
  const w=S.config.drawWeights,tot=TYPES.reduce((t,k)=>t+(+w[k]||0),0);
  if(tot<=0)return TYPES[rng(3)];
  let x=rng(1000000)/1000000*tot;
  for(const k of TYPES){x-=(+w[k]||0);if(x<0)return k;}
  return 'shield';
}
function goalReady(S,date){
  const g=S.goals[date];if(!g||g.resolved)return false;
  return g.closedByAdmin||missingFor(S,date).length===0;
}
function resolveGoal(S,date,now,rng,byAdmin){
  const g=S.goals[date];if(!g||g.resolved)return false;
  const winner=goalWinner(S,date,g.id);
  if(!winner){g.resolved={winner:null,at:now.toISOString(),awardId:null};return true;}
  const awardId='goal-'+date;
  if(!S.awards.some(a=>a.id===awardId))S.awards.push({id:awardId,pid:winner,type:drawType(S,rng),source:'goal '+date,at:now.toISOString()});
  g.resolved={winner,at:now.toISOString(),awardId};
  if(byAdmin)g.closedByAdmin=true;
  hist(S,byAdmin?'admin':'auto','goal '+date+' won by '+winner,now);
  return true;
}
function closeGoal(S,date,now,rng){
  const g=S.goals[date];if(!g)throw new Error('That goal has not been revealed yet.');
  if(g.resolved)throw new Error('Already resolved.');
  g.closedByAdmin=true;resolveGoal(S,date,now,rng,true);
}
function voidAward(S,id,now){
  const a=S.awards.find(x=>x.id===id);if(!a)throw new Error('Award not found.');
  a.voided=true;hist(S,'admin','void award '+id,now);
}

/* ---------- bingo ---------- */
const LINES_ROWS=[0,1,2,3,4].map(r=>[0,1,2,3,4].map(c=>r*5+c));
function claimOf(S,pid,sq){return ((S.bingo.claims[pid]||{})[sq])||null;}
function squareOk(S,pid,sq){
  const s=S.bingo.squares[sq];if(!s)return false;
  if(s.type==='free')return true;
  const c=claimOf(S,pid,sq);return !!(c&&c.status==='approved');
}
function bingoState(S,pid){
  const rowsDone=[];
  LINES_ROWS.forEach((row,i)=>{if(row.every(q=>squareOk(S,pid,q)))rowsDone.push(i);});
  const blackout=S.bingo.squares.every((s,i)=>squareOk(S,pid,i));
  return {rowsDone,blackout,marked:S.bingo.squares.map((s,i)=>squareOk(S,pid,i))};
}
function playerDays(S,pid){
  const out=[];
  dateRange(S.config.start,S.config.end).forEach(d=>{
    if(S.rest[pid]===d)return;const st=S.players[pid].steps[d];if(st==null)return;
    out.push({date:d,steps:st,pct:st/S.setup.baseline[pid]*100});
  });
  return out;
}
function autoCheck(S,pid,sq){
  const rule=S.bingo.squares[sq].rule||{},days=playerDays(S,pid);
  if(!days.length)return {ok:false,reason:'No steps logged yet.'};
  const byDate={};days.forEach(d=>{byDate[d.date]=d;});
  switch(rule.kind){
    case 'pct':{
      const hit=days.find(d=>d.pct>=rule.min);
      return hit?{ok:true}:{ok:false,reason:'Your best day so far is '+Math.round(Math.max.apply(null,days.map(d=>d.pct)))+'% of baseline (need '+rule.min+'%).'};}
    case 'streak':{
      let run=0,best=0,last=null;
      dateRange(S.config.start,S.config.end).forEach(d=>{
        if(S.rest[pid]===d)return;                                // a rest day neither counts nor breaks a streak
        const x=byDate[d];
        if(x&&x.pct>=rule.min){run++;if(run>best)best=run;}else run=0;
      });
      return best>=rule.days?{ok:true}:{ok:false,reason:'Your longest run at '+rule.min+'%+ is '+best+' day'+(best===1?'':'s')+' (need '+rule.days+').'};}
    case 'bounce':{
      const hit=days.find(d=>{const p=byDate[addDays(d.date,-1)];return d.pct>=100&&p&&p.pct<90;});
      return hit?{ok:true}:{ok:false,reason:'Need a day at 100%+ right after a day under 90%.'};}
    case 'bestmatch':{
      let hit=false;
      days.forEach((d,i)=>{if(i===0)return;const M=Math.max.apply(null,days.slice(0,i).map(x=>x.pct));if(M>0&&Math.abs(d.pct-M)/M*100<=rule.tol)hit=true;});
      return hit?{ok:true}:{ok:false,reason:'No day within '+rule.tol+'% of your earlier best yet.'};}
    case 'powerday':{
      const hit=days.find(d=>d.pct>=100&&playOn(S,pid,d.date));
      return hit?{ok:true}:{ok:false,reason:'Need a day at 100%+ on a day you played a power-up.'};}
  }
  return {ok:false,reason:'This square has no rule set.'};
}
function claimSquare(S,pid,sq,now,opts){
  opts=opts||{};
  const s=S.bingo.squares[sq];if(!s)throw new Error('No such square.');
  if(s.type==='free')throw new Error('That one is free.');
  if(s.minDate&&chi(now).date<s.minDate)throw new Error('This square opens on '+fmtDay(s.minDate)+'.');
  const cur=claimOf(S,pid,sq);
  if(cur&&cur.status==='approved')throw new Error('Already approved.');
  if(cur&&cur.status==='pending')throw new Error('Already waiting for approval.');
  S.bingo.claims[pid]=S.bingo.claims[pid]||{};
  const claim={status:'pending',at:now.toISOString(),by:pid};
  if(s.type==='auto'){const r=autoCheck(S,pid,sq);claim.status=r.ok?'approved':'rejected';if(!r.ok)claim.reason=r.reason;claim.auto=true;}
  else if(s.type==='photo'){if(!opts.photo)throw new Error('This square needs a photo.');claim.photo=opts.photo;}
  S.bingo.claims[pid][sq]=claim;
  hist(S,pid,'bingo claim '+sq+' -> '+claim.status,now);
  return claim;
}
function decideClaim(S,pid,sq,status,now){
  const c=claimOf(S,pid,sq);if(!c)throw new Error('No claim to decide.');
  if(status!=='approved'&&status!=='rejected')throw new Error('Bad status.');
  c.status=status;c.decidedAt=now.toISOString();if(status==='rejected')c.reason=c.reason||'Not approved.';
  hist(S,'admin','bingo '+status+' '+pid+' #'+sq,now);
}
function chooseBlackout(S,pid,type,now){
  if(!TYPES.includes(type))throw new Error('Pick Butter, Steal or Shield.');
  const a=S.awards.find(x=>x.id==='blackout-'+pid);
  if(!a||a.voided)throw new Error('No blackout to claim.');
  if(a.type)throw new Error('You already chose.');
  a.type=type;hist(S,pid,'blackout choice '+type,now);
}

/* ---------- maintain (idempotent; the only writer of reveals, awards, round results) ---------- */
function defaultRng(n){
  if(typeof crypto!=='undefined'&&crypto.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}
  return Math.floor(Math.random()*n);
}
function maintain(S,now,rng){
  rng=rng||defaultRng;
  let changed=false;const backups=[];
  const today=chi(now).date,c=S.config;
  // 1. reveal goals (past days catch up; today waits for 7:00 AM Chicago)
  if(today>=c.start){
    const last=today<c.end?today:c.end;
    dateRange(c.start,last).forEach(d=>{
      if(S.goals[d])return;
      if(d===today&&!atOrAfter(now,d,7))return;
      S.goals[d]={id:pickGoal(S,d,rng),revealedAt:now.toISOString(),resolved:null};
      backups.push('reveal-'+d);changed=true;
    });
  }
  // 1b. an unresolved goal whose rule was retired is swapped for an active one (resolved goals never change)
  Object.keys(S.goals).sort().forEach(d=>{const g=S.goals[d],def=goalById(g.id);if(!g.resolved&&def&&def.retired){const old=g.id;g.id=pickGoal(S,d,rng);hist(S,'auto','goal '+d+' swapped #'+old+' -> #'+g.id,now);changed=true;}});
  // 2. resolve goals
  Object.keys(S.goals).sort().forEach(d=>{if(goalReady(S,d)){resolveGoal(S,d,now,rng,false);changed=true;}});
  // 3. close rounds in order
  for(let r=1;r<=3;r++){
    if(S.rounds[r])continue;
    const res=closeRound(S,r,now,false);
    if(res!=='ok')break;
    changed=true;backups.push('lock-round'+r+'-'+chi(now).date+'_'+_pad(chi(now).h)+'-'+_pad(chi(now).m)+'-'+_pad(chi(now).s));
  }
  // 4. bingo awards (deterministic ids); un-approval voids what a row/blackout produced
  PIDS.forEach(pid=>{
    const b=bingoState(S,pid);
    LINES_ROWS.forEach((row,i)=>{
      const id='bingo-row-'+pid+'-'+i,a=S.awards.find(x=>x.id===id),done=b.rowsDone.includes(i);
      if(done&&!a){S.awards.push({id,pid,type:drawType(S,rng),source:'bingo row '+(i+1),at:now.toISOString()});changed=true;}
      else if(done&&a&&a.voided&&!a.manualVoid){a.voided=false;changed=true;}
      else if(!done&&a&&!a.voided){a.voided=true;changed=true;}
    });
    const id='blackout-'+pid,a=S.awards.find(x=>x.id===id);
    if(b.blackout&&!a){S.awards.push({id,pid,type:null,choice:true,source:'blackout',at:now.toISOString()});changed=true;}
    else if(!b.blackout&&a&&!a.voided){a.voided=true;changed=true;}
  });
  return {changed,backups};
}

function recomputeBaselines(S,now){
  if(S.rounds[1])throw new Error('Baselines are frozen once round 1 has closed.');
  S.setup.group=groupAvg(S.setup.prevAvg);
  S.setup.baseline=baselinesFrom(S.setup.prevAvg,S.config.w);
  S.setup.w=S.config.w;
  const seed=seedsFrom(S.setup.prevAvg);S.setup.seed=seed;
  PIDS.forEach(p=>{S.setup.team[p]=[1,4,6,7].includes(seed[p])?'A':'B';});
  hist(S,'admin','recompute baselines w='+S.config.w,now);
}

/* ---------- restore: a restore never un-reveals, un-closes or un-approves anything ---------- */
function mergeSticky(restored,cur){
  const out=ensureShape(clone(restored));
  out.epoch=cur.epoch;out.setup=clone(cur.setup);
  Object.keys(cur.goals).forEach(d=>{out.goals[d]=clone(cur.goals[d]);});
  Object.keys(cur.rounds).forEach(r=>{out.rounds[r]=clone(cur.rounds[r]);});
  Object.keys(cur.hold||{}).forEach(r=>{out.hold[r]=cur.hold[r];});
  cur.awards.forEach(a=>{const i=out.awards.findIndex(x=>x.id===a.id);if(i<0)out.awards.push(clone(a));else out.awards[i]=clone(a);});
  cur.plays.forEach(p=>{if(!out.plays.some(x=>x.id===p.id))out.plays.push(clone(p));});
  Object.keys(cur.entryAt).forEach(pid=>{out.entryAt[pid]=out.entryAt[pid]||{};Object.keys(cur.entryAt[pid]).forEach(d=>{if(!out.entryAt[pid][d])out.entryAt[pid][d]=cur.entryAt[pid][d];});});
  Object.keys(cur.bingo.claims).forEach(pid=>{
    Object.keys(cur.bingo.claims[pid]).forEach(sq=>{
      const c=cur.bingo.claims[pid][sq];
      if(c.status==='approved'){out.bingo.claims[pid]=out.bingo.claims[pid]||{};out.bingo.claims[pid][sq]=clone(c);}
    });
  });
  const seen={};out.history.forEach(h=>{seen[h.at+h.what]=1;});
  cur.history.forEach(h=>{if(!seen[h.at+h.what])out.history.push(h);});
  out.history.sort((a,b)=>a.at<b.at?-1:1);
  if(out.history.length>500)out.history.splice(0,out.history.length-500);
  return out;
}

/* ============ GITHUB I/O ============ */
const GH_OWNER='lauhoffm-ai';
const GH_REPO='pass-the-baton';
const GH_API='https://api.github.com';
const GH_STATE_PATH='data/state.json';
const GH_BAK_DIR='backups';
const GH_BAK_MAX=30;            // routine backups; reveal-/lock-/pre-pie-wars- backups are never pruned
const BAK_EXEMPT=/^(reveal-|lock-|pre-pie-wars-)/;
const GHT=(()=>{const a='ghp_ep2wIz';const b='rLNCLroBy52ZohdrHyPjk8k83LImP9';return a+b;})();

function NOW(){return window.__NOW?new Date(window.__NOW):new Date();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtN(n){return Math.round(n||0).toLocaleString('en-US');}
function pad(n){return String(n).padStart(2,'0');}
function stampNow(now){const c=chi(now);return c.date+'_'+pad(c.h)+'-'+pad(c.m)+'-'+pad(c.s);}
const GH_HEAD={Authorization:'token '+GHT,'Accept':'application/vnd.github+json'};

let STATE=null,stateSha=null,FOREIGN=false,LOADERR=null,saveInFlight=false,saveChain=Promise.resolve();
let activeTab='bracket',unlocked={admin:false},tdDate='',bingoPid='',bingoSq=-1,lastKey='',ADM_OPEN={},ADM_BAK=null;

async function ghGetFile(path){
  const r=await fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path+'?t='+Date.now(),{headers:GH_HEAD,cache:'no-store'});
  if(!r.ok) return null; // a 404 does not throw
  const d=await r.json();
  const content=decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));
  return {content,sha:d.sha};
}
async function ghSha(path){
  const r=await fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path+'?t='+Date.now(),{headers:GH_HEAD,cache:'no-store'});
  if(!r.ok) return null;
  const d=await r.json();return d.sha||null;
}
async function ghPutRaw(path,obj,sha,message){
  const body={message:message||('update '+path),content:btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,2)))),branch:'main'};
  if(sha) body.sha=sha;
  return fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},GH_HEAD),body:JSON.stringify(body)});
}
async function ghPutBinary(path,b64,sha,message){
  const body={message:message||('upload '+path),content:b64,branch:'main'};
  if(sha) body.sha=sha;
  return fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},GH_HEAD),body:JSON.stringify(body)});
}
async function ghDeleteFile(path,sha,message){
  return fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path,{method:'DELETE',headers:Object.assign({'Content-Type':'application/json'},GH_HEAD),body:JSON.stringify({message:message||('prune '+path),sha,branch:'main'})});
}

async function loadFresh(){
  let f;
  try{f=await ghGetFile(GH_STATE_PATH);}catch(e){return {error:'Could not reach GitHub ('+e.message+')'};}
  if(!f) return {state:defState(),sha:null,fresh:true};
  let s;
  try{s=JSON.parse(f.content);}catch(e){return {error:'state.json is not valid JSON'};}
  // a state file from another challenge is never overwritten by accident
  if(!s||s.challenge!==CHALLENGE_ID) return {state:defState(),sha:f.sha,foreign:true};
  return {state:ensureShape(s),sha:f.sha};
}

/* Every write: refetch on conflict, RE-APPLY the change on the fresh state, re-run maintain(), PUT again. */
function commit(mutator,msg){
  const p=saveChain.then(()=>_commit(mutator,msg));
  saveChain=p.catch(()=>{});
  return p;
}
async function _commit(mutator,msg){
  saveInFlight=true;
  try{
    for(let attempt=0;attempt<5;attempt++){
      if(attempt>0||!STATE){
        const f=await loadFresh();
        if(f.error) return {ok:false,error:f.error};
        STATE=f.state;stateSha=f.sha;FOREIGN=!!f.foreign;
      }
      if(FOREIGN) return {ok:false,error:'Pie Wars is not set up yet. Michael needs to initialize it from the admin panel.'};
      if(mutator){
        try{const r=mutator(STATE);if(r===false)return {ok:false,error:'Not saved.'};if(r&&typeof r==='object')STATE=r;}
        catch(e){return {ok:false,error:e.message};}
      }
      const now=NOW();
      const m=maintain(STATE,now);
      if(!mutator&&!m.changed) return {ok:true,noop:true};
      let routine=false;
      if(!STATE.lastBackupAt||(now-new Date(STATE.lastBackupAt))>6*3600e3){STATE.lastBackupAt=now.toISOString();routine=true;}
      const r=await ghPutRaw(GH_STATE_PATH,STATE,stateSha,msg||'update');
      if(r.status===409||r.status===422) continue;           // stale SHA: refetch, re-apply, retry
      if(!r.ok) return {ok:false,error:'GitHub save failed ('+r.status+')'};
      const j=await r.json();stateSha=j.content.sha;
      try{
        for(const n of m.backups) await writeBackup(n,STATE);
        if(routine) await writeBackup(stampNow(now),STATE);
      }catch(e){}
      return {ok:true};
    }
    return {ok:false,error:'Could not save after several tries. Reload and try again.'};
  }finally{saveInFlight=false;render();}
}

/* ---------- backups ---------- */
function bakStamp(name){
  const m=name.match(/(\d{4}-\d{2}-\d{2})(?:_(\d{2}-\d{2}-\d{2}))?/);
  return m?m[1]+'_'+(m[2]||'99-99-99'):'0000';
}
function bakSort(a,b){const x=bakStamp(a.name),y=bakStamp(b.name);return x<y?-1:x>y?1:a.name.localeCompare(b.name);}
async function writeBackup(name,obj){
  let r=await ghPutRaw(GH_BAK_DIR+'/'+name+'.json',obj,null,'backup '+name);
  if(r.status===422) r=await ghPutRaw(GH_BAK_DIR+'/'+name+'-b.json',obj,null,'backup '+name); // same name already taken
  if(r.ok) await pruneBackups();
  return r.ok;
}
async function listBackups(){
  const r=await fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_BAK_DIR+'?t='+Date.now(),{headers:GH_HEAD,cache:'no-store'});
  if(!r.ok) return [];
  const list=await r.json();
  return Array.isArray(list)?list.filter(f=>/\.json$/.test(f.name)).sort(bakSort):[];   // oldest first, by timestamp
}
// keep the newest GH_BAK_MAX routine backups; the OLDEST (by timestamp, not by file name) are deleted first
async function pruneBackups(){
  const list=await listBackups();
  if(!list.length) return;
  const routine=list.filter(f=>!BAK_EXEMPT.test(f.name));
  if(routine.length>GH_BAK_MAX){
    for(const f of routine.slice(0,routine.length-GH_BAK_MAX)) await ghDeleteFile(f.path,f.sha,'prune '+f.name);
  }
}
async function restoreBackup(path){
  const f=await ghGetFile(path);
  if(!f) throw new Error('Backup not found.');
  let b;try{b=JSON.parse(f.content);}catch(e){throw new Error('Backup is not valid JSON.');}
  if(!b||b.challenge!==CHALLENGE_ID) throw new Error('That backup belongs to a different challenge. Not restored.');
  const cur=await loadFresh();
  if(!cur.foreign&&!cur.error) await writeBackup('pre-restore-'+stampNow(NOW()),cur.state); // so a bad restore is undoable
  return commit(s=>mergeSticky(ensureShape(b),s),'restore from '+path); // reveals, closed rounds and approved claims survive
}

function teamDot(pid){return '<span class="tmdot '+STATE.setup.team[pid]+'"></span>';}
function teamName(t){return STATE.setup.teamNames[t];}
function picker(id,ph,val,extra){return '<select id="'+id+'"'+(extra?' '+extra:'')+'><option value="">'+esc(ph)+'</option>'+PIDS.map(p=>'<option value="'+p+'"'+(p===val?' selected':'')+'>'+esc(NAMES[p])+'</option>').join('')+'</select>';}
function toast(t,ok){const e=$('toast');e.textContent=t;e.className='show '+(ok?'ok':'bad');clearTimeout(toast._t);toast._t=setTimeout(()=>{e.className='';},ok?3200:6000);}
function listNames(a){return a.filter(Boolean).map(p=>NAMES[p]||p).join(', ');}
function pct1(x){return (Math.round(x*10)/10).toFixed(1);}
function challengeDates(){return dateRange(STATE.config.start,STATE.config.end);}
function loggableDates(pid){
  const t=today(),end=addDays(t,-1)<STATE.config.end?addDays(t,-1):STATE.config.end;
  if(end<STATE.config.start)return [];
  return dateRange(STATE.config.start,end).filter(d=>!isClosedDate(STATE,d)&&(!pid||STATE.rest[pid]!==d));
}

/* ---------- personal unlock (D5) ---------- */
function unlockRec(){try{return JSON.parse(sessionStorage.getItem('uPW')||'{}')||{};}catch(e){return {};}}
function setUnlockRec(r){try{sessionStorage.setItem('uPW',JSON.stringify(r));}catch(e){}}
// a remembered unlock only counts while the epoch AND that player's code are unchanged
function playerUnlocked(pid){
  if(unlocked.admin)return true;
  if(!STATE||!pid)return false;
  const r=unlockRec()[pid];
  return !!(r&&r.epoch===STATE.epoch&&(r.code===STATE.players[pid].code||r.next===STATE.players[pid].code));
}
function unlockedPids(){return PIDS.filter(p=>playerUnlocked(p));}
function doUnlock(){
  const pid=$('pu_name').value,code=$('pu_code').value.trim();
  if(!pid){toast('Choose your name first.',false);return;}
  if(STATE.players[pid].code!==code){toast('That code is not right.',false);return;}
  const r=unlockRec();r[pid]={epoch:STATE.epoch,code};setUnlockRec(r);toast('Unlocked, '+NAMES[pid]+'.',true);render(true);
}
function doLock(){setUnlockRec({});render(true);}
async function act(mut,msg,okText){
  if(FOREIGN){toast('Pie Wars is not set up yet.',false);return false;}
  const r=await commit(s=>{mut(s,NOW());},msg);
  if(!r.ok){toast(r.error,false);return false;}
  toast(okText||'Saved',true);render(true);return true;
}
function actAsPlayer(pid){
  if(!playerUnlocked(pid)){toast('Unlock with your code first.',false);return false;}
  return true;
}

/* ============ VIEWS ============ */
function cdBarHTML(now){
  const c=chi(now),S=STATE;
  if(c.date<S.config.start)return 'Pie Wars starts '+fmtDay(S.config.start);
  if(c.date>S.config.end)return '';
  if(c.h<7){const left=(7-c.h)*3600-c.m*60-c.s;return 'Today\'s mini-goal reveals in '+pad(Math.floor(left/3600))+':'+pad(Math.floor(left%3600/60))+':'+pad(left%60);}
  return '';
}
function tickCountdown(){
  if(!STATE||FOREIGN)return;
  const bar=$('cdbar'),cd=cdBarHTML(NOW());
  if(bar.innerHTML!==cd){bar.innerHTML=cd;bar.style.display=cd?'block':'none';}
}

function matchHTML(r,m,closed){
  const S=STATE;
  function side(pid,avg,raw,win){
    return '<div class="side'+(win?' win':'')+'">'+avatar(pid,'md')+'<div class="pc"><div><div class="nm">'+teamDot(pid)+esc(NAMES[pid])+'</div><div class="pi">'+esc(S.setup.pieNames[pid])+' · base '+fmtN(S.setup.baseline[pid])+'</div></div></div>'
      +'<div class="sc">'+pct1(avg)+'<small>'+(closed?'final':'so far')+'</small></div></div>';
  }
  const A=closed?m.aAvg:roundStats(S,r,m.a,false).avg,B=closed?m.bAvg:roundStats(S,r,m.b,false).avg;
  return '<div class="match"><div class="lab">'+esc(MATCH_LABEL[m.id])+(m.place?' · '+(m.place===1?'1st/2nd':m.place+'th/'+(m.place+1)+'th'):'')+(m.bracket==='C'?' · consolation':'')+'</div>'
    +side(m.a,A,0,closed&&m.winner===m.a)+'<div class="vs">VS</div>'+side(m.b,B,0,closed&&m.winner===m.b)+'</div>';
}
function waitingHTML(r){
  const t=today(),out=[];
  roundDateList(STATE,r).forEach(d=>{
    if(d>=t)return;
    const names=listNames(missingFor(STATE,d));
    if(names)out.push('<div class="mu">'+fmtDay(d)+': waiting on '+esc(names)+'</div>');
  });
  return out.join('');
}
function podiumHTML(){
  const pl=placements(STATE);if(!pl)return '';
  const by=Object.keys(pl).sort((a,b)=>pl[a]-pl[b]);
  const lead=teamLeader(STATE),tt=teamTotals(STATE);
  let h='<div class="ban gold"><h3 style="margin:0;font-family:Fraunces,serif">🏆 '+esc(NAMES[by[0]])+' wins Pie Wars!</h3>';
  h+='<div class="mu">'+(lead?'Team champion: <b>'+esc(teamName(lead))+'</b> ('+tt[lead]+' to '+tt[lead==='A'?'B':'A']+')':'Teams are tied.')+'</div></div>';
  h+='<div class="card"><h3>Final standings</h3>'+by.map(p=>'<div class="row" style="margin:6px 0">'+'<b style="width:28px">'+pl[p]+'</b>'+avatar(p,'sm')+'<div class="nm">'+esc(NAMES[p])+' <span class="mu">'+esc(STATE.setup.pieNames[p])+'</span></div></div>').join('')+'</div>';
  return h;
}
function renderBracket(now){
  const S=STATE,names=['Quarterfinals','Semifinals','Championship round'];
  let h=podiumHTML();
  for(let r=1;r<=3;r++){
    const R=roundDates(S)[r-1],closed=!!S.rounds[r];
    h+='<div class="sec"><h2>'+names[r-1]+' <span class="mu">'+fmtDay(R[0])+' to '+fmtDay(R[1])+(closed?' · final':'')+(S.hold[r]?' · HELD':'')+'</span></h2>';
    const ms=closed?S.rounds[r].matches:matchupsForRound(S,r);
    if(!ms)h+='<div class="card mu">Matchups are set when round '+(r-1)+' closes.</div>';
    else{
      h+=ms.map(m=>matchHTML(r,m,closed)).join('');
      if(!closed){const w=waitingHTML(r);if(w)h+='<div class="card">'+w+'</div>';}
    }
    h+='</div>';
  }
  return h;
}

function todayDates(){
  const t=today(),end=addDays(t,-1)<STATE.config.end?addDays(t,-1):STATE.config.end;
  return end<STATE.config.start?[]:dateRange(STATE.config.start,end);
}
function goalCard(date,title){
  const S=STATE,g=S.goals[date];
  if(!g)return '<div class="card"><h3>'+title+'</h3><div class="mu">'+(date===today()?'Revealed at 7:00 AM Chicago time.':'Not revealed.')+'</div></div>';
  const def=goalById(g.id);
  let h='<div class="card"><h3>'+title+' · '+fmtDay(date)+'</h3><div style="font-weight:800;font-size:18px">'+esc(def.name)+'</div>'+(g.id===20?'<div class="mu">Featured team: <b>'+esc(teamName(spotlightTeam(S,date)))+'</b> (only its players can win)</div>':'');
  if(g.resolved){h+=g.resolved.winner?'<div class="ban ok" style="margin-top:8px">🏅 Winner: <b>'+esc(NAMES[g.resolved.winner])+'</b></div>':'<div class="mu" style="margin-top:6px">No winner (nobody qualified).</div>';}
  else{const miss=missingFor(S,date);h+='<div class="mu" style="margin-top:6px">Measured on '+fmtDay(date)+' steps. '+(date>=today()?'Logged tomorrow morning.':(miss.length?'Waiting on '+esc(listNames(miss))+'.':'Resolving…'))+'</div>';}
  return h+'</div>';
}
function renderToday(now){
  const S=STATE,t=today();let h='';
  h+=goalCard(t,'Today\'s mini-goal');
  const y=addDays(t,-1);if(y>=S.config.start&&y<=S.config.end)h+=goalCard(y,'Yesterday\'s mini-goal');
  const ds=todayDates();
  if(!ds.length)return h+'<div class="card mu">Scores appear after the first day is logged.</div>';
  if(!tdDate||!ds.includes(tdDate))tdDate=ds[ds.length-1];
  h+='<div class="sec"><h2>Scores</h2><select id="td_date" onchange="tdDate=this.value;render(true)">'+ds.slice().reverse().map(d=>'<option value="'+d+'"'+(d===tdDate?' selected':'')+'>'+fmtDay(d)+'</option>').join('')+'</select>';
  const sc=dayScores(S,tdDate,false);
  h+='<div class="card"><table class="tbl"><tr><th>Player</th><th>Steps</th><th>%</th><th>Score</th></tr>';
  PIDS.slice().sort((a,b)=>S.setup.seed[a]-S.setup.seed[b]).forEach(p=>{
    const o=sc[p];let cells;
    if(o.rest)cells='<td colspan="3" class="mu">rest day 😴</td>';
    else if(o.pending)cells='<td colspan="3" class="mu">waiting…</td>';
    else cells='<td>'+fmtN(o.steps)+'</td><td>'+pct1(o.pct)+'%</td><td><b>'+pct1(o.final)+'</b>'+(o.butter?' 🧈':'')+(o.steal?' 🍴':'')+(o.loss>0?' ⬇':'')+'</td>';
    h+='<tr><td>'+avatar(p,'sm')+' '+esc(NAMES[p])+'</td>'+cells+'</tr>';
  });
  h+='</table></div></div>';
  return h;
}

/* ---------- Pantry ---------- */
function invHTML(pid){const i=inventory(STATE,pid);return '<div class="inv"><span class="pill o">🧈 '+i.butter+'</span><span class="pill o">🍴 '+i.steal+'</span><span class="pill g">🥧 shield '+i.shield+'</span></div>';}
function legalPlayDates(pid,type){
  const S=STATE,t=today();
  return dateRange(addDays(t,1)<S.config.start?S.config.start:addDays(t,1),S.config.end).filter(d=>{
    if(d<=t||isClosedDate(S,d)||S.rest[pid]===d||playOn(S,pid,d))return false;
    if(type==='steal'){const o=opponentOf(S,pid,d);if(!o||S.rest[o]===d)return false;}
    return true;
  });
}
function legalRestDates(pid){
  const S=STATE,t=today();
  return dateRange(t<S.config.start?S.config.start:t,S.config.end).filter(d=>!isClosedDate(S,d)&&S.players[pid].steps[d]==null);
}
function dateOpts(ds,sel){return ds.map(d=>'<option value="'+d+'"'+(d===sel?' selected':'')+'>'+fmtDay(d)+'</option>').join('');}
function playerPanel(pid){
  const S=STATE,inv=inventory(S,pid);
  let h='<div class="card"><div class="row sp"><div class="row">'+avatar(pid,'md')+'<div><div class="nm" style="font-weight:800">'+esc(NAMES[pid])+'</div><div class="mu">unlocked</div></div></div></div>'+invHTML(pid);
  pendingChoices(S,pid).forEach(()=>{h+='<div class="ban gold">🎉 BLACKOUT! Pick your power-up:<div class="row" style="margin-top:6px"><button class="btn sm2" onclick="doBlackout(\''+pid+'\',\'butter\')">🧈 Butter</button><button class="btn sm2" onclick="doBlackout(\''+pid+'\',\'steal\')">🍴 Steal</button><button class="btn sm2" onclick="doBlackout(\''+pid+'\',\'shield\')">🥧 Shield</button></div></div>';});
  const types=['butter','steal'].filter(t=>inv[t]>0);
  h+='<label>Play a power-up</label>';
  if(!types.length)h+='<div class="mu">Nothing to play right now.</div>';
  else{
    h+='<select id="pw_type_'+pid+'" onchange="refreshPlayDates(\''+pid+'\')">'+types.map(t=>'<option value="'+t+'">'+(t==='butter'?'🧈 Extra Butter':'🍴 Steal a Slice')+'</option>').join('')+'</select>';
    const ds=legalPlayDates(pid,types[0]);
    h+='<select id="pw_date_'+pid+'" onchange="playHint(\''+pid+'\')">'+(ds.length?dateOpts(ds):'<option value="">No legal dates</option>')+'</select><div class="mu" id="pw_hint_'+pid+'"></div>';
    h+='<button class="btn block" onclick="doPlay(\''+pid+'\')">PLAY</button>';
  }
  const rd=S.rest[pid];
  h+='<label style="margin-top:8px;display:block">Rest day</label>';
  if(rd){h+='<div class="pill g">Used on '+fmtDay(rd)+(S.players[pid].steps[rd]!=null?' (locked)':'')+'</div>';}
  else{const ds=legalRestDates(pid);h+=ds.length?'<select id="rs_date_'+pid+'">'+dateOpts(ds)+'</select><button class="btn alt block" onclick="doRest(\''+pid+'\')">CLAIM REST DAY</button>':'<div class="mu">No dates available.</div>';}
  h+='<details style="margin-top:8px"><summary>Change my code</summary><input id="cc_old_'+pid+'" type="password" inputmode="numeric" placeholder="Current code"><input id="cc_new_'+pid+'" type="password" inputmode="numeric" placeholder="New code (4 to 8 digits)"><input id="cc_new2_'+pid+'" type="password" inputmode="numeric" placeholder="New code again"><button class="btn alt block" onclick="doCode(\''+pid+'\')">SAVE CODE</button></details>';
  return h+'</div>';
}
function renderPantry(now){
  const S=STATE;let h='';
  const ups=unlockedPids().filter(p=>!unlocked.admin||true);
  if(unlocked.admin)h+='<div class="ban gold">Admin is open: every player is unlocked.</div>';
  h+='<div class="card"><h3>🔑 Unlock</h3><div class="mu">Power-ups, rest days and bingo claims need your personal code (default 1111).</div>'
    +picker('pu_name','Choose your name...','')+'<input id="pu_code" type="password" inputmode="numeric" placeholder="Your code"><div class="row"><button class="btn" onclick="doUnlock()">UNLOCK</button><button class="btn alt" onclick="doLock()">LOCK</button></div></div>';
  (unlocked.admin?PIDS:ups).forEach(p=>{h+=playerPanel(p);});
  h+='<div class="sec"><h2>Everyone\'s pantry</h2></div>';
  PIDS.slice().sort((a,b)=>S.setup.seed[a]-S.setup.seed[b]).forEach(p=>{
    h+='<div class="card"><div class="row">'+avatar(p,'sm')+'<div class="nm" style="font-weight:800">'+teamDot(p)+esc(NAMES[p])+'</div><div style="margin-left:auto" class="mu">'+(S.rest[p]?'rest: '+fmtDay(S.rest[p]):'rest unused')+'</div></div>'+invHTML(p)+'</div>';
  });
  const pl=S.plays.slice().reverse().slice(0,30);
  h+='<div class="card"><h3>Play history</h3>'+(pl.length?pl.map(p=>{
    const st=p.status==='blocked'?'🛡 blocked':p.status==='void'?'voided':restHit(S,p)?'returned (rest day)':'played';
    return '<div class="mu">'+fmtDay(p.date)+' · '+esc(NAMES[p.pid])+' '+(p.type==='butter'?'🧈 Butter':'🍴 Steal'+(p.target?' on '+esc(NAMES[p.target]):''))+' · '+st+'</div>';
  }).join(''):'<div class="mu">Nothing played yet.</div>')+'</div>';
  return h;
}
function refreshPlayDates(pid){
  const type=$('pw_type_'+pid).value,ds=legalPlayDates(pid,type);
  $('pw_date_'+pid).innerHTML=ds.length?dateOpts(ds):'<option value="">No legal dates</option>';playHint(pid);
}
function playHint(pid){
  const e=$('pw_hint_'+pid);if(!e)return;
  const type=$('pw_type_'+pid).value,d=$('pw_date_'+pid).value;
  if(type!=='steal'||!d){e.textContent='';return;}
  const o=opponentOf(STATE,pid,d);
  e.textContent=o?('Steals from '+NAMES[o]+'.'+(inventory(STATE,o).shield>0?' ⚠ '+NAMES[o]+' holds a Shield: your Steal will be blocked and wasted.':'')):'';
}
function doPlay(pid){
  if(!actAsPlayer(pid))return;
  const type=$('pw_type_'+pid).value,d=$('pw_date_'+pid).value;
  if(!d){toast('Choose a date.',false);return;}
  if(type==='steal'){const o=opponentOf(STATE,pid,d);if(o&&inventory(STATE,o).shield>0&&!confirm(NAMES[o]+' holds a Shield. Your Steal will be blocked and used up. Play anyway?'))return;}
  act((s,now)=>{playPowerup(s,pid,type,d,now);},'play '+type+' '+pid,'Played for '+fmtDay(d)+'.');
}
function doRest(pid){
  if(!actAsPlayer(pid))return;
  const d=$('rs_date_'+pid).value;if(!d){toast('Choose a date.',false);return;}
  if(!confirm('Use your one rest day on '+fmtDay(d)+'? You only get one.'))return;
  act((s,now)=>{claimRest(s,pid,d,now);},'rest '+pid,'Rest day set for '+fmtDay(d)+'.');
}
function doBlackout(pid,type){if(!actAsPlayer(pid))return;act((s,now)=>{chooseBlackout(s,pid,type,now);},'blackout choice','Added to your pantry.');}
async function doCode(pid){
  if(!actAsPlayer(pid))return;
  const o=$('cc_old_'+pid).value.trim(),n=$('cc_new_'+pid).value.trim(),n2=$('cc_new2_'+pid).value.trim();
  if(o!==STATE.players[pid].code){toast('Your current code is not right.',false);return;}
  if(!/^\d{4,8}$/.test(n)){toast('Codes are 4 to 8 digits.',false);return;}
  if(n==='5678'){toast('That code is taken. Pick another.',false);return;}
  if(n!==n2){toast('The new codes do not match.',false);return;}
  const rec=unlockRec();rec[pid]={epoch:STATE.epoch,code:o,next:n};setUnlockRec(rec);
  const ok=await act(s=>{s.players[pid].code=n;hist(s,pid,'code changed',NOW());},'code '+pid,'Code changed.');
  const r2=unlockRec();
  if(ok){r2[pid]={epoch:STATE.epoch,code:n};}else{r2[pid]={epoch:STATE.epoch,code:o};}
  setUnlockRec(r2);render(true);
}

/* ---------- Bingo ---------- */
function photoURL(c){return 'https://raw.githubusercontent.com/'+GH_OWNER+'/'+GH_REPO+'/main/'+c.photo+'?v='+encodeURIComponent(c.at||'');}
function renderBingo(now){
  const S=STATE,sq=S.bingo.squares;let h='<div class="card"><h3>🦃 Turkey Bingo</h3><div class="mu">Complete a row for a power-up. Blackout = your pick. Photos are stored in a public repo: no kids\' faces, please.</div>'+picker('bv_name','View a player\'s card...',bingoPid,'onchange="bingoPid=this.value;bingoSq=-1;render(true)"')+'</div>';
  const pid=bingoPid;
  h+='<div class="bgrid">';
  sq.forEach((s,i)=>{
    const c=pid?claimOf(S,pid,i):null;
    const cls=s.type==='free'?'free':(c&&c.status==='approved'?'on':c&&c.status==='pending'?'pend':c&&c.status==='rejected'?'rej':'');
    h+='<button class="bsq '+cls+(i===bingoSq?' sel':'')+'" onclick="pickSq('+i+')">'+(s.type==='free'?'🥧 FREE':esc(s.text)+(c&&c.status==='approved'?' ✅':''))+'</button>';
  });
  h+='</div>';
  if(pid){const b=bingoState(S,pid);h+='<div class="card"><b>'+esc(NAMES[pid])+'</b> · rows '+b.rowsDone.length+'/5'+(b.blackout?' · BLACKOUT 🎉':'')+'</div>';}
  if(bingoSq>=0&&sq[bingoSq]&&sq[bingoSq].type!=='free'){
    const s=sq[bingoSq],c=pid?claimOf(S,pid,bingoSq):null;
    h+='<div class="card"><h3>'+esc(s.text)+'</h3><div class="mu">'+({auto:'Checked automatically against your logged steps.',photo:'Needs a photo. Michael approves it.',honor:'Honor system. Michael approves it.'})[s.type]+'</div>';
    if(!pid)h+='<div class="mu">Choose a player above first.</div>';
    else{
      if(c){h+='<div class="pill '+(c.status==='approved'?'g':c.status==='pending'?'o':'r')+'" style="margin:6px 0">'+esc(c.status)+'</div>'+(c.reason?'<div class="mu">'+esc(c.reason)+'</div>':'');if(c.photo)h+='<img class="bphoto" src="'+esc(photoURL(c))+'" alt="proof">';}
      if(!c||c.status==='rejected'){
        if(!playerUnlocked(pid))h+='<div class="mu">Unlock '+esc(NAMES[pid])+' in the Pantry tab to claim.</div>';
        else if(s.type==='photo')h+='<label>Take or choose a photo</label><input id="bph" type="file" accept="image/*" onchange="photoPicked()">';
        else h+='<button class="btn block" onclick="doClaim()">'+(s.type==='auto'?'CHECK MY STEPS':'CLAIM IT')+'</button>';
      }
    }
    h+='</div>';
  }
  return h;
}
function pickSq(i){bingoSq=i;render(true);}
function doClaim(){
  const pid=bingoPid,i=bingoSq;if(!actAsPlayer(pid))return;
  act((s,now)=>{claimSquare(s,pid,i,now);},'bingo claim','Claim saved.').then(()=>{const c=claimOf(STATE,pid,i);if(c&&c.status==='rejected')toast(c.reason||'Not yet.',false);});
}
function photoPicked(){
  const pid=bingoPid,i=bingoSq,f=$('bph').files[0];if(!f||!actAsPlayer(pid))return;
  toast('Resizing…',true);
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=async()=>{
    try{
      const sc=Math.min(1,800/Math.max(img.width,img.height)),cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);          // re-encoding strips EXIF/GPS
      const b64=cv.toDataURL('image/jpeg',0.7).split(',')[1],path='bingo/'+pid+'-'+i+'.jpg';
      toast('Uploading…',true);
      const sha=await ghSha(path),r=await ghPutBinary(path,b64,sha,'bingo photo '+pid+' '+i);
      if(!r.ok){toast('Photo upload failed ('+r.status+')',false);return;}
      await act((s,now)=>{claimSquare(s,pid,i,now,{photo:path});},'bingo photo claim','Photo sent. Waiting for approval.');
    }catch(e){toast('Photo failed: '+e.message,false);}
    URL.revokeObjectURL(url);
  };
  img.onerror=()=>toast('Could not read that image.',false);
  img.src=url;
}

function logHint(){
  const e=$('lg_hint');if(!e||!STATE)return;
  const pid=$('lg_name').value,d=$('lg_date').value,v=$('lg_steps').value;
  if(!pid){e.textContent='';return;}

  if(STATE.rest[pid]===d)t+=' That day is your rest day.';
  else if(STATE.players[pid].steps[d]!=null&&v==='')t+=' Already logged: '+fmtN(STATE.players[pid].steps[d])+'.';
  if(v!==''&&!isNaN(+v)){const pc=+v/base*100,sc=baseScore(STATE,pc);t+=' That is '+pct1(pc)+'% = about '+pct1(Math.min(STATE.config.cap,Math.max(STATE.config.floor,sc)))+' points before power-ups.';}
  e.textContent=t;

function doLog(){
  const pid=$('lg_name').value,d=$('lg_date').value,raw=$('lg_steps').value.trim();
  if(!pid){toast('Choose your name.',false);return;}

  const w=stepWarnings(STATE,pid,d,n);

}

/* ============ RENDER / REFRESH ============ */
function userEditing(){
  const a=document.activeElement;
  if($('adminOverlay').classList.contains('open'))return true;
  return !!(a&&(a.tagName==='INPUT'||a.tagName==='SELECT'||a.tagName==='TEXTAREA')&&a.closest('#view'));
}
function snapForm(root){const m={};root.querySelectorAll('input,select,textarea').forEach(e=>{if(e.id&&e.type!=='file')m[e.id]=e.value;});return m;}
function restoreForm(root,m){Object.keys(m).forEach(id=>{const e=root.querySelector('#'+id);if(e&&e.value!==m[id])e.value=m[id];});}
function renderHeader(){
  const tt=teamTotals(STATE),lead=teamLeader(STATE);
  $('teamStrip').innerHTML=['A','B'].map(t=>'<div class="tm '+t+(lead===t?' lead':'')+'"><div class="n">'+esc(teamName(t))+'</div><div class="p">'+tt[t]+'</div></div>').join('');
}
// render(true) = a deliberate redraw. render() = background: skips if nothing changed, otherwise redraws
// but puts every field value, the focus and the selection back, so a refresh never changes who a form is for.
function render(force){
  if(!STATE){return;}
  const now=NOW(),v=$('view');
  if(FOREIGN){
    $('cdbar').style.display='none';
    v.innerHTML='<div class="sec"><div class="ban">🥧 Pie Wars is not set up yet. Michael needs to open Admin (gear, top right) and press INITIALIZE PIE WARS.</div></div>';return;
  }
  renderHeader();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));
  const bar=$('cdbar'),cd=cdBarHTML(now);bar.innerHTML=cd;bar.style.display=cd?'block':'none';
  let html;
  if(activeTab==='today')html=renderToday(now);
  else if(activeTab==='pantry')html=renderPantry(now);
  else if(activeTab==='bingo')html=renderBingo(now);
  else if(activeTab==='teams')html=renderTeams(now);
  else if(activeTab==='log')html=renderLog(now);
  else html=renderBracket(now);
  if(LOADERR)html='<div class="ban">'+esc(LOADERR)+'</div>'+html;
  const key=activeTab+'|'+html;
  if(force){v.innerHTML=html;lastKey=key;}
  else if(key!==lastKey){
    const snap=snapForm(v),a=document.activeElement,fid=(a&&a.id&&v.contains(a))?a.id:null;
    const ss=(fid&&a.selectionStart!=null)?[a.selectionStart,a.selectionEnd]:null;
    v.innerHTML=html;lastKey=key;
    restoreForm(v,snap);
    if(fid){const e=$(fid);if(e){e.focus();try{if(ss)e.setSelectionRange(ss[0],ss[1]);}catch(x){}}}
  }
  if(activeTab==='log')logHint();
  if(activeTab==='pantry')PIDS.forEach(p=>{if($('pw_hint_'+p))playHint(p);});
}
function setTab(t){activeTab=t;render(true);window.scrollTo(0,0);}

async function refresh(){
  if(saveInFlight||userEditing())return;
  const f=await loadFresh();
  if(f.error){LOADERR=f.error;render();return;}
  if(saveInFlight||userEditing())return;      // never refresh over a save or an edit in progress
  LOADERR=null;STATE=f.state;stateSha=f.sha;FOREIGN=!!f.foreign;
  render();
  if(!FOREIGN)await commit(null,'auto: reveal/close');   // first browser after 7:00 AM writes the reveal
}
async function boot(){
  $('view').innerHTML='<div class="loader">PREHEATING&hellip;</div>';
  const f=await loadFresh();
  if(f.error){$('view').innerHTML='<div class="sec"><div class="ban">'+esc(f.error)+'</div><button class="btn block" onclick="boot()">TRY AGAIN</button></div>';return;}
  STATE=f.state;stateSha=f.sha;FOREIGN=!!f.foreign;
  render(true);
  if(!FOREIGN)await commit(null,'auto: reveal/close');
  setInterval(refresh,30000);
  setInterval(tickCountdown,1000);
}

function admSaveSettings(){
  const g=id=>Number($(id).value),c={w:g('st_w'),mult:g('st_mult'),cap:g('st_cap'),floor:g('st_floor'),butter:g('st_butter'),steal:g('st_steal')};
  const dw={butter:g('st_dw_b'),steal:g('st_dw_s'),shield:g('st_dw_h')};
  const start=$('st_start').value,end=$('st_end').value;
  const bad=[];
  if(!(c.w>=0&&c.w<=1))bad.push('weight 0 to 1');if(!(c.mult>=0&&c.mult<=10))bad.push('multiplier 0 to 10');
  if(!(c.cap>=100&&c.cap<=500))bad.push('cap 100 to 500');if(!(c.floor>=-100&&c.floor<=c.cap))bad.push('floor below cap');
  if(!(c.butter>=1&&c.butter<=3))bad.push('butter 1 to 3');if(!(c.steal>=0&&c.steal<=100))bad.push('steal 0 to 100');
  if(!(dw.butter>=0&&dw.steal>=0&&dw.shield>=0&&dw.butter+dw.steal+dw.shield>0))bad.push('draw weights');
  if(!start||!end||dayDiff(start,end)<8)bad.push('dates need at least 9 days');
  let rd=null;const ra=[0,1,2].map(i=>[$('st_r'+i+'a').value,$('st_r'+i+'b').value]);

    else if(ra[0][1]>=ra[1][0]||ra[1][1]>=ra[2][0])bad.push('rounds must not overlap');

  }
  if(bad.length){toast('Check: '+bad.join('; '),false);return;}
  if(STATE.rounds[1]&&(c.w!==STATE.config.w))if(!confirm('Round 1 is closed, so baselines stay frozen. Save the new weight anyway?'))return;
  act(s=>{Object.assign(s.config,c);s.config.drawWeights=dw;s.config.start=start;s.config.end=end;s.config.roundDates=rd;hist(s,'admin','settings saved',NOW());},'settings','Settings saved.').then(()=>renderAdmin());

function admUnapprove(p,i){if(!confirm('Un-approve this square? Any power-up it produced is voided.'))return;act((s,now)=>{decideClaim(s,p,i,'rejected',now);},'bingo unapprove','Un-approved.').then(()=>renderAdmin());}
function admSaveSquares(){
  const upd=STATE.bingo.squares.map((s,i)=>s.type==='free'?null:{t:$('bq_t_'+i).value.trim(),k:$('bq_k_'+i).value});
  if(upd.some((u,i)=>u&&(!u.t||(u.k==='auto'&&!STATE.bingo.squares[i].rule)))){toast('Every square needs text, and auto squares need a rule (existing auto squares keep theirs).',false);return;}
  act((s,now)=>{s.bingo.squares.forEach((q,i)=>{const u=upd[i];if(u){q.text=u.t;q.type=u.k;}});hist(s,'admin','bingo squares edited',now);},'squares','Saved.').then(()=>renderAdmin());
}

function restAdminHTML(){
  return '<div class="mu">One audit-logged exception for a real emergency. Cannot apply to a date with steps entered.</div>'+picker('ra_pid','Player...','')+'<select id="ra_date">'+dateOpts(challengeDates())+'</select><div class="row"><button class="btn" onclick="admGrantRest()">GRANT</button><button class="btn alt" onclick="admClearRest()">CLEAR THEIR REST</button></div>';
}
function admGrantRest(){const p=$('ra_pid').value,d=$('ra_date').value;if(!p)return;act((s,now)=>{claimRest(s,p,d,now,{admin:true});},'admin rest','Rest day set.').then(()=>renderAdmin());}
function admClearRest(){const p=$('ra_pid').value;if(!p)return;act((s,now)=>{clearRest(s,p,now);},'admin clear rest','Cleared.').then(()=>renderAdmin());}

function backupsHTML(){
  let h='<button class="btn block" onclick="admBackupNow()">BACKUP NOW</button><button class="btn alt block" onclick="admListBackups()">LIST BACKUPS</button><div id="bak_list">';
  if(ADM_BAK){
    const ex=ADM_BAK.filter(f=>BAK_EXEMPT.test(f.name)).length;
    h+='<div class="mu">'+ADM_BAK.length+' files: '+ex+' event backups (never pruned) and '+(ADM_BAK.length-ex)+' routine (newest '+GH_BAK_MAX+' kept).</div>';
    h+=ADM_BAK.slice().reverse().map(f=>'<div class="row sp" style="margin:4px 0"><span class="mu" style="word-break:break-all">'+esc(f.name)+(BAK_EXEMPT.test(f.name)?' 🔒':'')+'</span><button class="btn alt sm2" onclick="admRestore(\''+esc(f.path)+'\')">RESTORE</button></div>').join('');
  }
  return h+'</div>';
}
async function admBackupNow(){
  const ok=await writeBackup('manual-'+stampNow(NOW()),STATE);toast(ok?'Backup written.':'Backup failed.',ok);
}
async function admListBackups(){ADM_BAK=await listBackups();ADM_OPEN.backups=true;renderAdmin();}
async function admRestore(path){
  if(!confirm('Restore from '+path+'?\n\nSteps, rest days, plays and codes come from the backup. Goal reveals, closed rounds, approved claims and awards you already have are kept. A pre-restore backup is written first.'))return;
  try{const r=await restoreBackup(path);toast(r.ok?'Restored.':r.error,r.ok);if(r.ok){render(true);renderAdmin();}}catch(e){toast(e.message,false);}
}

function dangerHTML(){
  return '<div class="mu">INITIALIZE archives whatever is in state.json to backups/pre-pie-wars-... first, then starts a clean Pie Wars with the 13th Floor averages as seeds.</div>'
    +'<button class="btn block" onclick="admInit()">INITIALIZE PIE WARS</button>'
    +(FOREIGN?'':'<button class="btn red block" onclick="admReset()">RESET ENTIRE CHALLENGE</button>');
}
async function admInit(){
  if(!confirm('INITIALIZE Pie Wars?\n\nThe current state.json is archived first, then replaced with a clean Pie Wars.'))return;
  await archiveAndWrite('initialize pie wars');
}
async function admReset(){
  if(!confirm('RESET the entire challenge? All steps, plays, goals and claims are erased (a pre-pie-wars backup is written first).'))return;
  if(!confirm('Really reset? Everyone is logged out and codes go back to 1111.'))return;
  await archiveAndWrite('reset pie wars');
}
async function archiveAndWrite(msg){
  saveInFlight=true;
  try{
    const f=await ghGetFile(GH_STATE_PATH);
    if(f){
      let o;try{o=JSON.parse(f.content);}catch(e){o={unparseable:f.content};}
      const r=await ghPutRaw(GH_BAK_DIR+'/pre-pie-wars-'+stampNow(NOW())+'.json',o,null,'archive before '+msg);
      if(!r.ok){toast('Could not write the archive ('+r.status+'). Nothing was changed.',false);return;}
    }
    const s=defState();hist(s,'admin',msg.toUpperCase(),NOW());
    const r=await ghPutRaw(GH_STATE_PATH,s,f?f.sha:null,msg);
    if(!r.ok){toast('Save failed ('+r.status+'). Try again.',false);return;}
    const j=await r.json();STATE=s;stateSha=j.content.sha;FOREIGN=false;ADM_BAK=null;setUnlockRec({});
    toast('Pie Wars is ready.',true);
  }catch(e){toast('Failed: '+e.message,false);}
  finally{saveInFlight=false;}
  render(true);renderAdmin();
  commit(null,'auto: reveal/close');
}

boot();

</script>
