<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The 13th Floor | Marcos &amp; Muscles</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060a;--panel:#100e13;--panel2:#0b0a0e;--line:#2b2522;--line2:#1a1614;
  --bone:#ece4d3;--dim:#948a79;--dimmer:#5d564b;--orange:#ff7a1a;--orange-dim:#8f4510;
  --disp:'Cinzel',serif;--mono:'Courier Prime',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);}
body{background:var(--bg);color:var(--bone);font-family:var(--mono);font-size:15px;line-height:1.55;padding-bottom:90px;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% -10%,rgba(255,122,26,.10),transparent 55%),radial-gradient(ellipse at 50% 110%,rgba(0,0,0,.7),transparent 60%);}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;}
@keyframes flick{0%,100%{opacity:1}46%{opacity:1}48%{opacity:.55}50%{opacity:1}53%{opacity:.7}55%{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(255,122,26,.45)}50%{box-shadow:0 0 26px rgba(255,122,26,.9)}}
.small{font-size:12px;color:var(--dim);}
b{color:var(--bone);}

.hdr{text-align:center;padding:34px 16px 16px;position:relative;}
.hdr-top{font-size:11px;letter-spacing:6px;color:var(--dim);}
.hdr h1{font-family:var(--disp);font-weight:900;font-size:40px;letter-spacing:3px;line-height:1.05;margin-top:8px;color:var(--bone);text-shadow:0 0 22px rgba(255,122,26,.28);animation:flick 7s infinite;}
.hdr h1 em{font-style:normal;color:var(--orange);}
.hdr-sub{font-size:11px;letter-spacing:3px;color:var(--dim);margin-top:8px;}

.cdbar{margin:6px 14px 0;border:1px solid var(--orange-dim);background:rgba(255,122,26,.05);text-align:center;padding:8px 10px;}
.cdbar .cd-l{font-size:10px;letter-spacing:3px;color:var(--dim);}
.cdbar .cd-t{font-family:var(--disp);font-size:24px;color:var(--orange);letter-spacing:2px;}

.tabs{display:flex;gap:0;margin:14px 14px 0;border-bottom:1px solid var(--line);}
.tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font-family:var(--mono);font-size:12px;letter-spacing:1px;padding:11px 2px;cursor:pointer;text-transform:uppercase;}
.tab.active{color:var(--orange);border-bottom-color:var(--orange);}

main{padding:0 14px;}
.sec{margin-top:20px;}
.sec-ttl{font-family:var(--disp);font-size:16px;letter-spacing:3px;color:var(--orange);}
.sec-sub{font-size:12px;color:var(--dim);margin:2px 0 10px;}

.ban{border-left:3px solid var(--orange);background:linear-gradient(90deg,rgba(255,122,26,.09),transparent);padding:9px 12px;margin-top:10px;font-size:14px;}
.ban.trick{border-left-color:var(--bone);background:linear-gradient(90deg,rgba(236,228,211,.09),transparent);font-style:italic;}
.ban.wait{border-left-color:var(--dimmer);background:none;color:var(--dim);font-size:13px;}
.ban small{display:block;color:var(--dim);font-size:11px;margin-top:2px;}

.crewgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
.ccard{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));padding:12px 9px 11px;position:relative;min-width:0;}
.ck-lbl{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:1px;text-align:center;color:var(--bone);min-height:34px;display:flex;align-items:center;justify-content:center;line-height:1.15;}
.tower{display:flex;flex-direction:column;gap:3px;margin:8px auto;width:100%;max-width:120px;padding:6px;border:1px solid var(--line);background:#050407;}
.fl{display:flex;align-items:center;justify-content:center;height:21px;border:1px solid var(--line2);color:var(--dimmer);font-size:12px;position:relative;background:#0a090c;}
.fl.done{color:var(--dim);border-color:#3a2f27;background:#120f0d;}
.fl.lit{color:#1b0d02;background:var(--orange);border-color:var(--orange);font-weight:700;box-shadow:0 0 14px rgba(255,122,26,.7);}
.fl.thirteen{color:var(--orange);border-color:var(--orange);background:#190c03;font-weight:700;animation:pulse 2.2s infinite;}
.fl.locked{border-style:dashed;border-color:#5a3b22;}
.fl .lk{position:absolute;right:4px;font-style:normal;font-size:10px;}
.ck-nums{text-align:center;font-size:12px;color:var(--dim);margin-top:2px;}
.ck-nums b{font-size:15px;color:var(--bone);}
.kv{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--dim);border-top:1px dotted var(--line);padding-top:4px;margin-top:4px;}
.kv b{font-size:12px;}
.barwrap{height:7px;background:#050407;border:1px solid var(--line);margin-top:8px;}
.bar{height:100%;background:var(--orange);box-shadow:0 0 8px rgba(255,122,26,.6);}
.lockbox{margin-top:8px;border:1px dashed var(--orange-dim);padding:7px 7px;text-align:center;background:rgba(255,122,26,.05);}
.lockbox .lb-h{font-family:var(--disp);font-size:12px;letter-spacing:1px;color:var(--orange);}
.lockbox .lb-s{font-size:11px;color:var(--dim);}
.hmeter{margin-top:8px;border:1px solid var(--orange-dim);padding:8px 7px;text-align:center;background:rgba(255,122,26,.05);}
.hmeter .hm-h{font-family:var(--disp);font-size:12px;color:var(--orange);letter-spacing:1px;}
.stamp{display:inline-block;font-family:var(--disp);font-weight:900;font-size:15px;letter-spacing:1px;padding:4px 8px;border:3px solid;transform:rotate(-4deg);margin-top:8px;}
.stamp.escaped{color:var(--orange);border-color:var(--orange);text-shadow:0 0 12px rgba(255,122,26,.5);}
.stamp.trapped{color:var(--dim);border-color:var(--dim);}

.log-e{border-left:2px solid var(--orange-dim);padding:4px 0 4px 10px;margin-bottom:6px;font-size:13px;}
.log-e.latest{border-left-color:var(--orange);}
.ts{font-size:11px;color:var(--dimmer);}

/* final */
.fin{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px;}
.fcard{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));padding:18px 14px;text-align:center;}
.fcard h3{font-family:var(--disp);font-size:20px;letter-spacing:1px;}
.fcard .stamp{font-size:24px;margin:12px 0;}
.fcard .fl-line{font-size:13px;color:var(--dim);}
.fcard .fl-line b{color:var(--bone);}
.hist{margin-top:12px;text-align:left;border-top:1px dotted var(--line);padding-top:8px;}
.hist div{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:1px 0;}
.hist div b{color:var(--bone);font-weight:400;}
.shots{display:flex;justify-content:center;gap:6px;margin-top:12px;}
.shot{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid var(--orange-dim);background:#0a0e14;}

/* crew page */
.gate{border:1px solid var(--line);background:var(--panel);padding:16px;text-align:center;margin-top:10px;}
.gate-lbl{font-family:var(--disp);letter-spacing:3px;font-size:13px;margin-bottom:8px;color:var(--orange);}
input,select,button{font-family:var(--mono);font-size:16px;}
input[type=tel],input[type=text],input[type=number],input[type=date],input[type=password],select{background:#050407;color:var(--bone);border:1px solid var(--line);padding:10px;width:100%;border-radius:0;}
.gate input{max-width:200px;text-align:center;letter-spacing:6px;}
.btn,.gate button,.cr-row button,.board-form button{background:var(--orange);color:#1b0d02;border:none;padding:10px 14px;font-weight:700;letter-spacing:1px;cursor:pointer;}
.btn.ghost{background:none;border:1px solid var(--orange-dim);color:var(--orange);}
.btn.danger{background:#6b1a12;color:var(--bone);}
.btn.block{display:block;width:100%;margin-top:8px;}
.am{min-height:18px;font-size:13px;margin-top:8px;}
.am.ok{color:var(--orange);}.am.err{color:#ff8f7a;}
.unl{font-size:11px;letter-spacing:3px;color:var(--orange);}
.cr-row{display:flex;gap:6px;margin-top:8px;}
.stack{display:grid;gap:8px;margin-top:8px;}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pcard{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));padding:12px 8px;text-align:center;}
.pp{width:88px;height:88px;border-radius:50%;object-fit:cover;display:block;background:#0a0e14;margin:0 auto;border:2px solid var(--orange-dim);}
.p-name{font-family:var(--disp);font-weight:700;margin-top:8px;letter-spacing:1px;}
.p-stats{font-size:12px;color:var(--dim);margin-top:2px;}
.ghosts{font-size:12px;color:var(--orange);margin-top:4px;min-height:18px;}
.room{border-left:2px solid var(--orange-dim);padding:6px 0 6px 10px;margin-bottom:8px;}
.room b{font-family:var(--disp);letter-spacing:1px;}
.room.lockd{border-left-style:dashed;}
.room p{font-size:13px;color:var(--dim);font-style:italic;}
.board{background:#050407;border:1px solid var(--line);padding:8px 10px;max-height:190px;overflow-y:auto;}
.board-e{font-size:13px;padding:3px 0;border-bottom:1px dotted var(--line);}
.board-e .who{color:var(--orange);}
.board-form{display:grid;grid-template-columns:110px 1fr auto;gap:6px;margin-top:8px;}

/* log */
.f-row{margin-top:10px;}
.f-row label{display:block;font-size:11px;letter-spacing:2px;color:var(--dim);margin-bottom:4px;}

/* admin */
.fab{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:#14110f;color:var(--dimmer);border:1px solid var(--line);font-size:17px;z-index:5;cursor:pointer;}
.aov{display:none;position:fixed;inset:0;z-index:30;background:rgba(5,4,7,.99);overflow-y:auto;padding:0 14px 60px;}
.aov.open{display:block;}
.ahdr{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--orange-dim);margin-bottom:10px;max-width:560px;margin-left:auto;margin-right:auto;}
.att{font-family:var(--disp);letter-spacing:3px;color:var(--orange);}
.acl{background:none;border:1px solid var(--line);color:var(--dim);padding:6px 10px;font-size:13px;cursor:pointer;}
#adminBody{max-width:560px;margin:0 auto;}
.as{border:1px solid var(--line);border-left:2px solid var(--orange-dim);background:var(--panel);padding:12px;margin-bottom:12px;}
.ast{font-family:var(--disp);letter-spacing:2px;font-size:13px;color:var(--orange);margin-bottom:6px;}
.al{display:block;font-size:11px;letter-spacing:1px;color:var(--dim);margin:8px 0 3px;}
.bak-row,.arow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;border-bottom:1px dotted var(--line);padding:5px 0;}
.bak-row button,.arow button{background:none;border:1px solid var(--orange-dim);color:var(--orange);padding:4px 8px;font-size:12px;cursor:pointer;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.loader{text-align:center;padding:60px 0;color:var(--dim);letter-spacing:3px;animation:flick 3s infinite;}
@media(min-width:520px){.fin{grid-template-columns:1fr 1fr;}.hdr h1{font-size:52px;}}

</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <button class="fab" onclick="openAdmin()" aria-label="Admin">&#9881;</button>
    <div class="hdr-top">NOW CHECKING IN</div>
    <h1>THE <em>13TH</em> FLOOR</h1>
    <div class="hdr-sub">MARCOS &amp; MUSCLES &middot; TWO CREWS &middot; ONE HOTEL</div>
  </header>
  <div class="cdbar" id="cdbar" style="display:none"></div>
  <nav class="tabs">
    <button class="tab active" data-tab="main" onclick="setTab('main')">Hotel</button>
    <button class="tab" id="tabCrypt" data-tab="crypt" onclick="setTab('crypt')">Crypt Keepers</button>
    <button class="tab" id="tabLost" data-tab="lost" onclick="setTab('lost')">Lost Souls</button>
    <button class="tab" data-tab="log" onclick="setTab('log')">Log</button>
  </nav>
  <main id="view"></main>
  <div class="aov" id="adminOverlay">
    <div class="ahdr"><div class="att">&#9632; BACKDOOR</div><button class="acl" onclick="closeAdmin()">[X] CLOSE</button></div>
    <div id="adminBody"></div>
  </div>
</div>
<script>
/* ============ ENGINE (pure game logic, no DOM, no network) ============ */
const TZ='America/Chicago';
const CHALLENGE_ID='13th-floor';

const DEFAULTS={
  start:'2026-10-18',      // day 1
  climbEnd:'2026-10-30',   // last day that counts toward floors 1-12
  halloween:'2026-10-31',  // 13th floor day
  floorSize:54000,         // counted steps per floor
  floors:12,
  lockedFloors:[4,8,12],
  unlockSteps:60000,       // raw crew steps in one local day to open a door
  hBase:810000,            // Halloween target = hBase - banked
  hMin:20000,
  hMax:90000,
  bonusCap:15000,          // possessed player's first N steps count double
  revealHour:7,            // 7:00 AM CT the morning after
  graceEnd:'2026-11-02',   // last date entries are accepted...
  graceHour:10             // ...until this hour (CT) on that date
};

const CREWS={
  crypt:{label:'The Crypt Keepers',members:['michael','jordan','lauren','allen']},
  lost:{label:'The Lost Souls',members:['chris','kaykay','meghan','shania']}
};
const CREW_KEYS=['crypt','lost'];
const DEFAULT_COMBO='1313';
const ADMIN_PIN='5678';

const PLAYERS=[
  {id:'michael',username:'swolesib',display:'Michael'},
  {id:'jordan',username:'JojoOnTheMove',display:'Jordan'},
  {id:'lauren',username:'LAU-RUN',display:'Lauren'},
  {id:'allen',username:'Quintero',display:'Allen'},
  {id:'chris',username:'WhiskeyWalks',display:'Chris'},
  {id:'kaykay',username:'KayKay_Wanders',display:'KayKay'},
  {id:'meghan',username:'MegaFit91',display:'Meghan'},
  {id:'shania',username:'nizinthehiz',display:'Shania'}
];
function playerMeta(pid){return PLAYERS.find(p=>p.id===pid);}
function crewOf(pid){return CREWS.crypt.members.includes(pid)?'crypt':'lost';}

const ROOMS=[
  null,
  {name:'The Lobby',text:'The front desk bell rings on its own. Your keys are already on the counter.'},
  {name:'The Laundry',text:'Every sheet in the dryer is still warm. Nobody has stayed here in forty years.'},
  {name:'The Dining Hall',text:'Thirteen places are set. One chair is pulled out, waiting.'},
  {name:'The Bridal Suite',text:'Someone is humming behind the door. It stops when you knock.'},
  {name:'The Boiler Room',text:'The pipes knock back in the same rhythm as your footsteps.'},
  {name:'The Nursery',text:"A music box is playing. It isn't wound."},
  {name:'The Library',text:'One book is missing from every shelf, and they all have your name on the spine.'},
  {name:'The Portrait Gallery',text:'The eyes follow you. The new portrait at the end looks a lot like your crew.'},
  {name:'The Ice Room',text:'Your breath fogs. The thermostat says 72.'},
  {name:'The Seance Parlor',text:'The planchette spells out a number: 13.'},
  {name:'The Bell Tower Stairs',text:'The stairs keep going past where the hotel should end.'},
  {name:"The Owner's Suite",text:"A ledger lists every guest who never checked out. There's room for your crew's names."},
  {name:'The 13th Floor',text:"It isn't on any map. The exit sign is glowing. Get out before midnight."}
];

/* ---------- config / time ---------- */
function cfg(state){return Object.assign({},DEFAULTS,(state&&state.config)||{});}

const _fmt=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
function chi(now){
  const p={};
  _fmt.formatToParts(now||new Date()).forEach(x=>{p[x.type]=x.value;});
  return {date:p.year+'-'+p.month+'-'+p.day,h:(+p.hour)%24,m:+p.minute,s:+p.second};
}
function _pad(n){return String(n).padStart(2,'0');}
function addDays(d,n){
  const [y,m,dd]=d.split('-').map(Number);
  const t=new Date(Date.UTC(y,m-1,dd)+n*864e5);
  return t.getUTCFullYear()+'-'+_pad(t.getUTCMonth()+1)+'-'+_pad(t.getUTCDate());
}
function dayDiff(a,b){
  const pa=a.split('-').map(Number),pb=b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/864e5);
}
function dateRange(a,b){const out=[];for(let d=a;d<=b;d=addDays(d,1))out.push(d);return out;}
function atOrAfter(now,date,hour){const c=chi(now);return c.date>date||(c.date===date&&c.h>=hour);}
function fmtDay(d){const [,m,dd]=d.split('-').map(Number);return m+'/'+dd;}

/* ---------- state ---------- */
function defState(){
  const players={};
  PLAYERS.forEach(p=>{players[p.id]={steps:{}};});
  const crews={};
  CREW_KEYS.forEach(k=>{crews[k]={name:CREWS[k].label,members:CREWS[k].members.slice(),combination:DEFAULT_COMBO,board:[]};});
  return {
    version:1, challenge:CHALLENGE_ID, epoch:(Math.random().toString(36).slice(2,10)+Date.now().toString(36)), config:{},
    crews, players,
    reveals:{crypt:{},lost:{}},   // date -> {player, at}   (only ever contains past, revealed picks)
    doors:{crypt:{},lost:{}},     // floor -> {day, at}      (sticky once opened)
    targets:{crypt:null,lost:null},   // locked Halloween target
    verdicts:{crypt:null,lost:null},
    hold:{crypt:false,lost:false},
    floorSeen:{crypt:1,lost:1},
    history:[], lastBackupAt:null
  };
}
function ensureShape(s){
  if(!s.epoch)s.epoch='e0';
  s.config=s.config||{};
  s.reveals=s.reveals||{};s.doors=s.doors||{};s.targets=s.targets||{};s.verdicts=s.verdicts||{};
  s.hold=s.hold||{};s.floorSeen=s.floorSeen||{};s.history=s.history||[];s.players=s.players||{};
  CREW_KEYS.forEach(k=>{
    s.reveals[k]=s.reveals[k]||{};s.doors[k]=s.doors[k]||{};
    if(s.targets[k]===undefined)s.targets[k]=null;
    if(s.verdicts[k]===undefined)s.verdicts[k]=null;
    if(s.hold[k]===undefined)s.hold[k]=false;
    if(!s.floorSeen[k])s.floorSeen[k]=1;
  });
  PLAYERS.forEach(p=>{s.players[p.id]=s.players[p.id]||{steps:{}};s.players[p.id].steps=s.players[p.id].steps||{};});
  return s;
}

/* ---------- steps / banking ---------- */
function stepsOf(s,pid,date){return Number(s.players[pid]&&s.players[pid].steps&&s.players[pid].steps[date])||0;}
function crewMembers(s,ck){return (s.crews&&s.crews[ck]&&s.crews[ck].members)||CREWS[ck].members;}
function crewRaw(s,ck,date){return crewMembers(s,ck).reduce((t,p)=>t+stepsOf(s,p,date),0);}
function bonusOn(s,ck,date){
  const r=s.reveals[ck]&&s.reveals[ck][date];
  if(!r)return 0;
  return Math.min(stepsOf(s,r.player,date),cfg(s).bonusCap);
}
function countedOn(s,ck,date){return crewRaw(s,ck,date)+bonusOn(s,ck,date);}
function climbDays(s){const c=cfg(s);return dateRange(c.start,c.climbEnd);}
function bankedThrough(s,ck,date){
  return climbDays(s).filter(d=>d<=date).reduce((t,d)=>t+countedOn(s,ck,d),0);
}
function banked(s,ck){return bankedThrough(s,ck,cfg(s).climbEnd);}
function possessions(s,ck){
  return Object.keys(s.reveals[ck]||{}).sort().map(d=>({date:d,player:s.reveals[ck][d].player,bonus:bonusOn(s,ck,d),raw:stepsOf(s,s.reveals[ck][d].player,d)}));
}
function possessedCount(s,ck,pid){return Object.values(s.reveals[ck]||{}).filter(r=>r.player===pid).length;}

/* ---------- doors ---------- */
function landingDay(s,ck,L){
  const c=cfg(s),T=(L-1)*c.floorSize;
  for(const d of climbDays(s)){if(bankedThrough(s,ck,d)>=T)return d;}
  return null;
}
// opens any door whose qualifying day exists. One qualifying day opens at most one door.
function evalDoors(s,ck,now){
  const c=cfg(s),opened=[],today=chi(now).date;
  const used=new Set(Object.values(s.doors[ck]).map(x=>x.day));
  for(const L of c.lockedFloors){
    if(s.doors[ck][L])continue;
    const land=landingDay(s,ck,L);
    if(!land)break;
    const last=today<c.climbEnd?today:c.climbEnd;
    for(const d of dateRange(land,last)){
      if(used.has(d))continue;
      if(crewRaw(s,ck,d)>=c.unlockSteps){
        s.doors[ck][L]={day:d,at:new Date(now).toISOString()};
        used.add(d);opened.push({floor:L,day:d});break;
      }
    }
    if(!s.doors[ck][L])break; // later doors wait for this one
  }
  return opened;
}

/* ---------- floors ---------- */
function floorInfo(s,ck,now){
  const c=cfg(s),b=banked(s,ck);
  const rawFloor=Math.min(c.floors,Math.floor(b/c.floorSize)+1);
  const hal=chi(now).date>=c.halloween;
  let display=rawFloor,lockedAt=null;
  if(!hal){
    for(const L of c.lockedFloors){
      if(rawFloor>=L&&!s.doors[ck][L]){display=L-1;lockedAt=L;break;}
    }
  }
  const cleared=b>=c.floors*c.floorSize&&(hal||!c.lockedFloors.some(L=>!s.doors[ck][L]));
  const intoFloor=lockedAt?c.floorSize:Math.min(c.floorSize,Math.max(0,b-(display-1)*c.floorSize));
  return {
    banked:b,rawFloor,display,lockedAt,hal,cleared,
    intoFloor,
    toNext:lockedAt?null:Math.max(0,display*c.floorSize-b),
    waitingBehindDoor:lockedAt?Math.max(0,b-(lockedAt-1)*c.floorSize):0,
    roomsReached:Math.min(hal?13:c.floors,display+(lockedAt?1:0)),
    floor13:hal
  };
}

/* ---------- Halloween ---------- */
function targetFor(s,bankedTotal){const c=cfg(s);return Math.max(c.hMin,Math.min(c.hMax,c.hBase-bankedTotal));}
function halloweenInfo(s,ck,now){
  const c=cfg(s),locked=s.targets[ck];
  const b=banked(s,ck);
  const raw=crewRaw(s,ck,c.halloween);
  const target=locked?locked.target:targetFor(s,b);
  return {raw,target,isEstimate:!locked,banked:locked?locked.banked:b,met:raw>=target};
}

/* ---------- reveal bookkeeping ---------- */
function revealDue(s,day,now){return atOrAfter(now,addDays(day,1),cfg(s).revealHour);}
function waitingOn(s,ck,now){
  const c=cfg(s),today=chi(now).date;
  for(const d of climbDays(s)){
    if(s.reveals[ck][d])continue;
    if(d>=today)return null;                       // that day isn't over yet
    const missing=crewMembers(s,ck).filter(p=>!(stepsOf(s,p,d)>0));
    return {date:d,missing,waitingForMorning:missing.length===0&&!revealDue(s,d,now)};
  }
  return null;
}
function randInt(n,rng){
  if(rng)return Math.floor(rng()*n);
  const a=new Uint32Array(1);const lim=Math.floor(4294967296/n)*n;
  do{crypto.getRandomValues(a);}while(a[0]>=lim);
  return a[0]%n;
}
// the bag is derived from past reveals, so nothing about the future is ever stored
function drawPossessed(s,ck,rng){
  const members=crewMembers(s,ck);
  const past=Object.keys(s.reveals[ck]).sort().map(d=>s.reveals[ck][d].player);
  const inCycle=past.length%members.length;
  const used=past.slice(past.length-inCycle);
  const pool=members.filter(p=>!used.includes(p));
  return pool[randInt(pool.length,rng)];
}

function logEvent(s,ck,text,kind,now){
  s.history.unshift({at:new Date(now).toISOString(),crew:ck,kind,text});
  if(s.history.length>60)s.history.length=60;
}

/* ---------- the one function that moves state forward ---------- */
function maintain(s,now,rng){
  ensureShape(s);
  const c=cfg(s),res={changed:false,backups:[]};
  const flag=()=>{res.changed=true;};
  CREW_KEYS.forEach(ck=>{
    const name=s.crews[ck].name;
    // 1) possession reveals, in order, only after the day ended + 7 AM + all four logged
    for(const d of climbDays(s)){
      if(s.reveals[ck][d])continue;
      if(!revealDue(s,d,now))break;
      if(crewMembers(s,ck).some(p=>!(stepsOf(s,p,d)>0)))break;
      const pick=drawPossessed(s,ck,rng);
      s.reveals[ck][d]={player:pick,at:new Date(now).toISOString()};
      logEvent(s,ck,playerMeta(pick).display+' was possessed on '+fmtDay(d)+'. +'+bonusOn(s,ck,d).toLocaleString('en-US')+' steps for '+name+'.','reveal',now);
      res.backups.push('reveal-'+d);flag();
    }
    // 2) doors
    evalDoors(s,ck,now).forEach(o=>{logEvent(s,ck,'The door to floor '+o.floor+' swung open for '+name+'.','door',now);flag();});
    // 3) new floors reached (public text carries no room names)
    const fi=floorInfo(s,ck,now);
    if(fi.display>s.floorSeen[ck]){
      s.floorSeen[ck]=fi.display;
      logEvent(s,ck,name+' reached floor '+fi.display+'.','floor',now);flag();
    }
    // 4) Halloween target locks at 7 AM on 10/31 once the 10/30 reveal exists (or at the deadline)
    const deadline=atOrAfter(now,c.graceEnd,c.graceHour);
    if(!s.targets[ck]){
      const ready=atOrAfter(now,c.halloween,c.revealHour)&&s.reveals[ck][c.climbEnd];
      if(ready||deadline){
        const b=banked(s,ck);
        s.targets[ck]={banked:b,target:targetFor(s,b),at:new Date(now).toISOString(),forced:!ready};
        logEvent(s,ck,name+"'s Halloween target is locked at "+s.targets[ck].target.toLocaleString('en-US')+' steps.','target',now);
        res.backups.push('lock-target-'+ck);flag();
      }
    }
    // 5) verdict: early once 10/31 is over and all four logged, otherwise at the grace deadline
    if(!s.verdicts[ck]&&!s.hold[ck]&&s.targets[ck]){
      const allIn=crewMembers(s,ck).every(p=>stepsOf(s,p,c.halloween)>0);
      const over=chi(now).date>c.halloween;
      if(deadline||(over&&allIn)){
        const raw=crewRaw(s,ck,c.halloween),t=s.targets[ck].target;
        s.verdicts[ck]={outcome:raw>=t?'escaped':'trapped',raw,target:t,banked:s.targets[ck].banked,at:new Date(now).toISOString(),early:!deadline};
        logEvent(s,ck,name+': '+(raw>=t?'ESCAPED':'CHECKED IN FOREVER')+'.','verdict',now);
        res.backups.push('lock-verdict-'+ck);flag();
      }
    }
  });
  return res;
}

/* ---------- step entry rules ---------- */
function canLog(s,pid,date,val,now){
  const c=cfg(s),cur=chi(now);
  if(!playerMeta(pid))return 'Unknown player.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return 'Pick a date.';
  if(date<c.start||date>c.halloween)return 'Steps only count from '+fmtDay(c.start)+' to '+fmtDay(c.halloween)+'.';
  if(date>cur.date)return "That day hasn't happened yet.";
  if(!Number.isFinite(val)||val<0||val>150000||Math.floor(val)!==val)return 'Enter a whole number of steps (0-150,000).';
  if(atOrAfter(now,c.graceEnd,c.graceHour))return 'Logging closed at 10:00 AM on '+fmtDay(c.graceEnd)+'.';
  if(s.verdicts[crewOf(pid)])return "This crew's verdict is already locked. Ask Michael.";
  return null;
}

/* ---------- restore safety: a restore never un-reveals or re-locks ---------- */
function mergeSticky(restored,current){
  ensureShape(restored);ensureShape(current);
  restored.epoch=current.epoch;   // a restore must not log crews out
  CREW_KEYS.forEach(ck=>{
    Object.keys(current.reveals[ck]).forEach(d=>{restored.reveals[ck][d]=current.reveals[ck][d];});
    Object.keys(current.doors[ck]).forEach(L=>{restored.doors[ck][L]=current.doors[ck][L];});
    if(current.targets[ck])restored.targets[ck]=current.targets[ck];
    if(current.verdicts[ck])restored.verdicts[ck]=current.verdicts[ck];
    restored.floorSeen[ck]=Math.max(restored.floorSeen[ck]||1,current.floorSeen[ck]||1);
  });
  return restored;
}

/* ============ GITHUB I/O ============ */
const GH_OWNER='lauhoffm-ai';
const GH_REPO='pass-the-baton';
const GH_API='https://api.github.com';
const GH_STATE_PATH='data/state.json';
const GH_BAK_DIR='backups';
const GH_BAK_MAX=30;            // routine backups; reveal-/lock-/pre-13th-floor- backups are never pruned
const BAK_EXEMPT=/^(reveal-|lock-|pre-13th-floor-)/;
const GHT=(()=>{const a='ghp_ep2wIz';const b='rLNCLroBy52ZohdrHyPjk8k83LImP9';return a+b;})();

function NOW(){return window.__NOW?new Date(window.__NOW):new Date();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtN(n){return Math.round(n||0).toLocaleString('en-US');}
function pad(n){return String(n).padStart(2,'0');}
function stampNow(now){const c=chi(now);return c.date+'_'+pad(c.h)+'-'+pad(c.m)+'-'+pad(c.s);}
const GH_HEAD={Authorization:'token '+GHT,'Accept':'application/vnd.github+json'};

async function ghGetFile(path){
  const r=await fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path+'?t='+Date.now(),{headers:GH_HEAD,cache:'no-store'});
  if(!r.ok) return null; // a 404 does not throw
  const d=await r.json();
  const content=decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));
  return {content,sha:d.sha};
}
async function ghPutRaw(path,obj,sha,message){
  const body={message:message||('update '+path),content:btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,2)))),branch:'main'};
  if(sha) body.sha=sha;
  return fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},GH_HEAD),body:JSON.stringify(body)});
}
async function ghDeleteFile(path,sha,message){
  return fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path,{method:'DELETE',headers:Object.assign({'Content-Type':'application/json'},GH_HEAD),body:JSON.stringify({message:message||('prune '+path),sha,branch:'main'})});
}

let STATE=null,stateSha=null,FOREIGN=false,LOADERR=null;
let saveInFlight=false,saveChain=Promise.resolve();
let activeTab='main';
let unlocked={admin:false};   // admin is never remembered: re-enter the PIN every time
function unlockRec(){try{return JSON.parse(sessionStorage.getItem('u13')||'{}')||{};}catch(e){return {};}}
function setUnlockRec(r){try{sessionStorage.setItem('u13',JSON.stringify(r));}catch(e){}}
// a remembered crew unlock only counts while the challenge epoch and the crew's combination are unchanged,
// so changing the code or resetting the challenge locks everyone back out
function crewUnlocked(ck){
  if(unlocked.admin)return true;
  if(!STATE)return false;
  const r=unlockRec()[ck];
  return !!(r&&r.epoch===STATE.epoch&&(r.combo===STATE.crews[ck].combination||r.next===STATE.crews[ck].combination));
}
function rememberUnlock(ck){const r=unlockRec();r[ck]={epoch:STATE.epoch,combo:STATE.crews[ck].combination};setUnlockRec(r);}
function lockCrew(ck){const r=unlockRec();delete r[ck];setUnlockRec(r);render(true);}

async function loadFresh(){
  let f;
  try{f=await ghGetFile(GH_STATE_PATH);}catch(e){return {error:'Could not reach GitHub ('+e.message+')'};}
  if(!f) return {state:defState(),sha:null,fresh:true};
  let s;
  try{s=JSON.parse(f.content);}catch(e){return {error:'state.json is not valid JSON'};}
  // a state file from another challenge is never overwritten by accident
  if(!s||s.challenge!==CHALLENGE_ID) return {state:defState(),sha:f.sha,foreign:true};
  return {state:ensureShape(s),sha:f.sha};
}

/* Every write: refetch on conflict, RE-APPLY the change on the fresh state, re-run maintain(), PUT again.
   (A blind retry with a new SHA would overwrite a possession reveal another browser just wrote.) */
function commit(mutator,msg){
  const p=saveChain.then(()=>_commit(mutator,msg));
  saveChain=p.catch(()=>{});
  return p;
}
async function _commit(mutator,msg){
  saveInFlight=true;
  try{
    for(let attempt=0;attempt<5;attempt++){
      if(attempt>0||!STATE){
        const f=await loadFresh();
        if(f.error) return {ok:false,error:f.error};
        STATE=f.state;stateSha=f.sha;FOREIGN=!!f.foreign;
      }
      if(FOREIGN) return {ok:false,error:'This hotel is not set up yet. Michael needs to initialize it from the admin panel.'};
      if(mutator){
        try{const r=mutator(STATE);if(r===false)return {ok:false,error:'Not saved.'};if(r&&typeof r==='object')STATE=r;}
        catch(e){return {ok:false,error:e.message};}
      }
      const now=NOW();
      const m=maintain(STATE,now);
      if(!mutator&&!m.changed) return {ok:true,noop:true};
      let routine=false;
      if(!STATE.lastBackupAt||(now-new Date(STATE.lastBackupAt))>6*3600e3){STATE.lastBackupAt=now.toISOString();routine=true;}
      const r=await ghPutRaw(GH_STATE_PATH,STATE,stateSha,msg||'update');
      if(r.status===409||r.status===422) continue;           // stale SHA: refetch, re-apply, retry
      if(!r.ok) return {ok:false,error:'GitHub save failed ('+r.status+')'};
      const j=await r.json();stateSha=j.content.sha;
      try{
        for(const n of m.backups) await writeBackup(n,STATE);
        if(routine) await writeBackup(stampNow(now),STATE);
      }catch(e){}
      return {ok:true};
    }
    return {ok:false,error:'Could not save after several tries. Reload and try again.'};
  }finally{saveInFlight=false;render();}
}

/* ---------- backups ---------- */
function bakStamp(name){
  const m=name.match(/(\d{4}-\d{2}-\d{2})(?:_(\d{2}-\d{2}-\d{2}))?/);
  return m?m[1]+'_'+(m[2]||'99-99-99'):'0000';
}
function bakSort(a,b){const x=bakStamp(a.name),y=bakStamp(b.name);return x<y?-1:x>y?1:a.name.localeCompare(b.name);}
async function writeBackup(name,obj){
  let r=await ghPutRaw(GH_BAK_DIR+'/'+name+'.json',obj,null,'backup '+name);
  if(r.status===422) r=await ghPutRaw(GH_BAK_DIR+'/'+name+'-b.json',obj,null,'backup '+name); // same name already taken
  if(r.ok) await pruneBackups();
  return r.ok;
}
async function listBackups(){
  const r=await fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_BAK_DIR+'?t='+Date.now(),{headers:GH_HEAD,cache:'no-store'});
  if(!r.ok) return [];
  const list=await r.json();
  return Array.isArray(list)?list.filter(f=>/\.json$/.test(f.name)).sort(bakSort):[];   // oldest first, by timestamp
}
// keep the newest GH_BAK_MAX routine backups; the OLDEST (by timestamp, not by file name) are deleted first
async function pruneBackups(){
  const list=await listBackups();
  if(!list.length) return;
  const routine=list.filter(f=>!BAK_EXEMPT.test(f.name));
  if(routine.length>GH_BAK_MAX){
    for(const f of routine.slice(0,routine.length-GH_BAK_MAX)) await ghDeleteFile(f.path,f.sha,'prune '+f.name);
  }
}
async function restoreBackup(path){
  const f=await ghGetFile(path);
  if(!f) throw new Error('Backup not found.');
  let b;try{b=JSON.parse(f.content);}catch(e){throw new Error('Backup is not valid JSON.');}
  if(!b||b.challenge!==CHALLENGE_ID) throw new Error('That backup belongs to a different challenge. Not restored.');
  const cur=await loadFresh();
  if(!cur.foreign&&!cur.error) await writeBackup('pre-restore-'+stampNow(NOW()),cur.state); // so a bad restore is undoable
  return commit(s=>mergeSticky(ensureShape(b),s),'restore from '+path); // reveals, opened doors and verdicts survive
}

/* ============ VIEW HELPERS ============ */
function todayCT(now){return chi(now).date;}
function cdSeconds(now){
  const c=cfg(STATE),cur=chi(now);
  const end=addDays(c.halloween,1);
  return dayDiff(cur.date,end)*86400-(cur.h*3600+cur.m*60+cur.s);
}
function fmtCd(sec){
  if(sec<=0)return '00:00:00';
  const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return (d?d+'d ':'')+pad(h)+':'+pad(m)+':'+pad(s);
}
function cdBarHTML(now){
  const c=cfg(STATE),cur=chi(now);
  if(cur.date>c.halloween) return '';
  const lbl=cur.date===c.halloween?'MIDNIGHT CT &middot; GET OUT BEFORE IT STRIKES':'THE 13TH FLOOR APPEARS IN';
  const sec=cur.date===c.halloween?cdSeconds(now):dayDiff(cur.date,c.halloween)*86400-(cur.h*3600+cur.m*60+cur.s);
  const lbl2=cur.date===c.halloween?lbl:lbl;
  return '<div class="cd-l">'+lbl2+'</div><div class="cd-t" data-cd="'+(cur.date===c.halloween?'end':'appear')+'">'+fmtCd(sec)+'</div>';
}
function tickCountdown(){
  if(!STATE)return;
  const now=NOW(),c=cfg(STATE),cur=chi(now);
  const el=document.querySelector('[data-cd]');
  if(!el)return;
  const sec=el.dataset.cd==='end'?cdSeconds(now):dayDiff(cur.date,c.halloween)*86400-(cur.h*3600+cur.m*60+cur.s);
  el.textContent=fmtCd(sec);
}

function bannersHTML(now){
  const c=cfg(STATE),cur=chi(now);let h='';
  if(cur.date===c.halloween) h+='<div class="ban trick">The spirits are out trick-or-treating tonight. Every step is your own.</div>';
  CREW_KEYS.forEach(ck=>{
    const nm=STATE.crews[ck].name,ps=possessions(STATE,ck),last=ps[ps.length-1];
    if(last&&cur.date<=c.halloween){
      const when=last.date===addDays(cur.date,-1)?'Last night':'On '+fmtDay(last.date);
      h+='<div class="ban"><b>'+when+', '+esc(playerMeta(last.player).display)+' was possessed.</b> +'+fmtN(last.bonus)+' steps for '+esc(nm)+'.</div>';
    }
    const w=waitingOn(STATE,ck,now);
    if(w&&cur.date<=c.halloween){
      if(w.missing.length===0&&!w.waitingForMorning){/* everyone is in and the reveal is being written: say nothing */}
      else if(w.waitingForMorning) h+='<div class="ban wait">'+esc(nm)+': everyone is in. The '+fmtDay(w.date)+' possession is revealed at 7:00 AM.</div>';
      else h+='<div class="ban wait">'+esc(nm)+': the '+fmtDay(w.date)+' possession is waiting on '+w.missing.map(p=>esc(playerMeta(p).display)).join(', ')+'.</div>';
    }
  });
  const cutoff=now.getTime()-36*3600e3;
  const ev=(STATE.history||[]).filter(e=>(e.kind==='door'||e.kind==='floor')&&new Date(e.at).getTime()>=cutoff).slice(0,5);
  ev.forEach(e=>{h+='<div class="ban">'+esc(e.text)+'</div>';});
  return h;
}

function crewCardHTML(ck,now){
  const c=cfg(STATE),crew=STATE.crews[ck],fi=floorInfo(STATE,ck,now),cur=chi(now),v=STATE.verdicts[ck];
  const inGame=cur.date>=c.start&&cur.date<=c.halloween;
  const todayRaw=inGame?crewRaw(STATE,ck,cur.date):0;
  let cells='';
  const top=fi.floor13?13:c.floors;
  for(let n=top;n>=1;n--){
    const locked=!fi.hal&&c.lockedFloors.includes(n)&&!STATE.doors[ck][n];
    let cls='fl';
    if(n===13)cls+=' thirteen';else if(n===fi.display)cls+=' lit';else if(n<fi.display)cls+=' done';
    if(locked)cls+=' locked';
    cells+='<div class="'+cls+'"><span>'+n+'</span>'+(locked?'<i class="lk">&#128274;</i>':'')+'</div>';
  }
  let mid='';
  if(cur.date>=c.halloween){
    const hi=halloweenInfo(STATE,ck,now),pct=Math.min(100,100*hi.raw/hi.target);
    mid='<div class="hmeter"><div class="hm-h">'+(hi.isEstimate?'ESCAPE TARGET (EST.)':'ESCAPE TARGET')+' '+fmtN(hi.target)+'</div>'
      +'<div class="barwrap"><div class="bar" style="width:'+pct+'%"></div></div>'
      +'<div class="small" style="margin-top:4px"><b>'+fmtN(hi.raw)+'</b> steps on 10/31'+(hi.met?' &middot; target met':'')+'</div></div>';
  }else if(fi.lockedAt){
    mid='<div class="lockbox"><div class="lb-h">&#128274; DOOR LOCKED &middot; FLOOR '+fi.lockedAt+'</div>'
      +'<div class="small">Today: <b>'+fmtN(todayRaw)+'</b> / '+fmtN(c.unlockSteps)+'</div>'
      +'<div class="barwrap"><div class="bar" style="width:'+Math.min(100,100*todayRaw/c.unlockSteps)+'%"></div></div>'
      +'<div class="lb-s" style="margin-top:4px">'+fmtN(fi.waitingBehindDoor)+' steps banked behind the door</div></div>';
  }else if(fi.cleared){
    mid='<div class="lockbox"><div class="lb-h">CLIMB COMPLETE</div><div class="lb-s">Waiting for the 13th floor.</div></div>';
  }else{
    mid='<div class="barwrap"><div class="bar" style="width:'+(100*fi.intoFloor/c.floorSize)+'%"></div></div>'
      +'<div class="small" style="text-align:center;margin-top:4px">'+fmtN(fi.toNext)+' to floor '+(fi.display+1)+'</div>';
  }
  const stampH=v?'<div style="text-align:center"><span class="stamp '+v.outcome+'">'+(v.outcome==='escaped'?'ESCAPED':'CHECKED IN FOREVER')+'</span></div>':'';
  return '<div class="ccard"><div class="ck-lbl">'+esc(crew.name)+'</div>'
    +'<div class="tower">'+cells+'</div>'
    +'<div class="ck-nums"><b>'+fmtN(fi.banked)+'</b> banked</div>'
    +'<div class="kv"><span>Today</span><b>'+fmtN(todayRaw)+'</b></div>'
    +mid+stampH+'</div>';
}

  const days=Object.keys(rec.steps||{}).filter(d=>rec.steps[d]>0);
  const total=days.reduce((t,d)=>t+rec.steps[d],0);
  const avg=days.length?Math.round(total/days.length):0;
  const best=days.length?Math.max(...days.map(d=>rec.steps[d])):0;

  const pd=Object.keys(STATE.reveals[ck]).filter(d=>STATE.reveals[ck][d].player===pid).sort();

function logHint(){
  const el=document.getElementById('logHintEl');if(!el||!STATE)return;
  const pid=document.getElementById('logWho').value,d=document.getElementById('logDate').value;
  if(!pid){el.textContent='';return;}
  const cur=stepsOf(STATE,pid,d);
  el.textContent=cur>0?('Currently logged for '+fmtDay(d)+': '+fmtN(cur)+'. Saving replaces it.'):('Nothing logged yet for '+fmtDay(d)+'.');
}
async function submitLog(){
  const pid=document.getElementById('logWho').value,date=document.getElementById('logDate').value,raw=document.getElementById('logVal').value;
  const val=raw===''?NaN:Number(raw),msg=document.getElementById('logMsg');
  if(!pid){msg.className='am err';msg.textContent='Pick your name first.';return;}
  const err=canLog(STATE,pid,date,val,NOW());
  if(err){msg.className='am err';msg.textContent=err;return;}
  msg.className='am';msg.textContent='Saving...';
  const res=await commit(s=>{const e=canLog(s,pid,date,val,NOW());if(e)throw new Error(e);s.players[pid].steps[date]=val;},'steps: '+pid+' '+date+'='+val);
  const m2=document.getElementById('logMsg');if(!m2)return;
  if(res.ok){m2.className='am ok';m2.textContent='Saved: '+fmtN(val)+' steps for '+playerMeta(pid).display+' on '+fmtDay(date)+'.';document.getElementById('logVal').value='';logHint();}
  else{m2.className='am err';m2.textContent=res.error;}
}

  else{const m=document.getElementById('comboMsg_'+ck);m.className='am err';m.textContent='WRONG COMBINATION';}

async function saveCrewName(ck){
  const v=document.getElementById('crewNameInput_'+ck).value.trim().slice(0,24);
  const m=document.getElementById('nameMsg_'+ck);
  if(!v){m.className='am err';m.textContent='Name cannot be empty.';return;}
  const res=await commit(s=>{s.crews[ck].name=v;},'crew name: '+ck);
  const m2=document.getElementById('nameMsg_'+ck);if(m2){m2.className='am '+(res.ok?'ok':'err');m2.textContent=res.ok?'Renamed.':res.error;}
}
async function changeCombo(ck){
  const cur=document.getElementById('cc_cur_'+ck).value.trim(),nw=document.getElementById('cc_new_'+ck).value.trim(),cf=document.getElementById('cc_cnf_'+ck).value.trim();
  const m=document.getElementById('comboChgMsg_'+ck);
  const bad=msg=>{m.className='am err';m.textContent=msg;};
  if(!/^\d{4,8}$/.test(nw))return bad('New combination must be 4 to 8 digits.');
  if(nw===ADMIN_PIN)return bad('Pick something else, that one is taken.');
  if(nw!==cf)return bad('The two new combinations do not match.');
  {const r0=unlockRec();r0[ck]=Object.assign({epoch:STATE.epoch,combo:STATE.crews[ck].combination},r0[ck]||{},{next:nw});setUnlockRec(r0);}  // so the redraw during the save does not bounce you to the gate
  const res=await commit(s=>{
    if(cur!==s.crews[ck].combination&&cur!==ADMIN_PIN)throw new Error('Current combination is wrong.');
    s.crews[ck].combination=nw;
  },'combination changed: '+ck);
  if(!res.ok){const r1=unlockRec();if(r1[ck]){delete r1[ck].next;setUnlockRec(r1);}}
  const m2=document.getElementById('comboChgMsg_'+ck);if(!m2)return;
  if(res.ok){rememberUnlock(ck);['cc_cur_','cc_new_','cc_cnf_'].forEach(p=>{const e=document.getElementById(p+ck);if(e)e.value='';});m2.className='am ok';m2.textContent='Combination changed. Tell your crew.';}
  else{m2.className='am err';m2.textContent=res.error;}
}
async function postBoard(ck){
  const sender=document.getElementById('boardSender_'+ck).value,t=document.getElementById('boardText_'+ck),text=(t.value||'').trim().slice(0,140);
  if(!text)return;
  t.value='';
  await commit(s=>{s.crews[ck].board=s.crews[ck].board||[];s.crews[ck].board.push({sender,text,ts:new Date().toISOString()});s.crews[ck].board=s.crews[ck].board.slice(-20);},'board: '+ck);
}

/* ============ RENDER / BOOT ============ */
function userEditing(){
  const a=document.activeElement;
  if(document.getElementById('adminOverlay').classList.contains('open'))return true;
  return !!(a&&(a.tagName==='INPUT'||a.tagName==='SELECT'||a.tagName==='TEXTAREA')&&a.closest('#view'));
}
let lastKey='';
function snapForm(root){const m={};root.querySelectorAll('input,select,textarea').forEach(e=>{if(e.id)m[e.id]=e.value;});return m;}
function restoreForm(root,m){Object.keys(m).forEach(id=>{const e=root.querySelector('#'+id);if(e&&e.value!==m[id])e.value=m[id];});}
// render(true) = a deliberate redraw (tab switch, unlock). render() = background: skips if nothing changed,
// otherwise redraws but puts every field value and the focus back, so a refresh can never change who a form is for.
function render(force){
  if(!STATE){return;}
  const now=NOW();
  document.getElementById('tabCrypt').textContent=STATE.crews.crypt.name;
  document.getElementById('tabLost').textContent=STATE.crews.lost.name;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));
  const bar=document.getElementById('cdbar');
  const cd=FOREIGN?'':cdBarHTML(now);bar.innerHTML=cd;bar.style.display=cd?'block':'none';
  const v=document.getElementById('view');
  let html;
  if(activeTab==='main')html=renderMain(now);
  else if(activeTab==='log')html=renderLog(now);
  else html=renderCrew(activeTab,now);
  const key=activeTab+'|'+html;
  if(force){v.innerHTML=html;lastKey=key;}
  else if(key!==lastKey){
    const snap=snapForm(v),a=document.activeElement,fid=(a&&a.id&&v.contains(a))?a.id:null;
    const ss=(fid&&a.selectionStart!=null)?[a.selectionStart,a.selectionEnd]:null;
    v.innerHTML=html;lastKey=key;
    restoreForm(v,snap);
    if(fid){const e=document.getElementById(fid);if(e){e.focus();try{if(ss)e.setSelectionRange(ss[0],ss[1]);}catch(x){}}}
  }
  if(activeTab==='log')logHint();
}
function setTab(t){activeTab=t;render(true);window.scrollTo(0,0);}

async function refresh(){
  if(saveInFlight||userEditing())return;
  const f=await loadFresh();
  if(f.error){LOADERR=f.error;return;}
  if(saveInFlight||userEditing())return;      // never refresh over a save or an edit in progress
  LOADERR=null;STATE=f.state;stateSha=f.sha;FOREIGN=!!f.foreign;
  render();
  if(!FOREIGN)await commit(null,'auto: reveal/door/target');   // first browser after 7:00 AM writes the reveal
}
async function boot(){
  document.getElementById('view').innerHTML='<div class="loader">CHECKING IN&hellip;</div>';
  const f=await loadFresh();
  if(f.error){document.getElementById('view').innerHTML='<div class="sec"><div class="ban">'+esc(f.error)+'</div><button class="btn block" onclick="boot()">TRY AGAIN</button></div>';return;}
  STATE=f.state;stateSha=f.sha;FOREIGN=!!f.foreign;
  render(true);
  if(!FOREIGN)await commit(null,'auto: reveal/door/target');
  setInterval(refresh,30000);
  setInterval(tickCountdown,1000);
}

  CREW_KEYS.forEach(k=>{
    reveals+='<div class="small" style="margin-top:8px;color:var(--orange)">'+esc(STATE.crews[k].name)+'</div>';
    const ps=possessions(STATE,k);
    reveals+=ps.length?ps.map(p=>'<div class="arow"><span>'+fmtDay(p.date)+' &middot; '+esc(playerMeta(p.player).display)+' (+'+fmtN(p.bonus)+')</span><button onclick="admRemoveReveal(\''+k+'\',\''+p.date+'\')">REMOVE</button></div>').join(''):'<div class="small">None revealed yet. Nothing is drawn ahead of time.</div>';
  });
  let doors='';
  CREW_KEYS.forEach(k=>{
    doors+='<div class="small" style="margin-top:8px;color:var(--orange)">'+esc(STATE.crews[k].name)+'</div>';
    c.lockedFloors.forEach(L=>{
      const d=STATE.doors[k][L];
      doors+='<div class="arow"><span>Floor '+L+': '+(d?'OPEN ('+(d.day==='admin'?'admin':fmtDay(d.day))+')':'locked')+'</span>'+(d?'<button onclick="admDoor(\''+k+'\','+L+',false)">RE-LOCK</button>':'<button onclick="admDoor(\''+k+'\','+L+',true)">OPEN</button>')+'</div>';
    });
  });
  let verd='';
  CREW_KEYS.forEach(k=>{
    const v=STATE.verdicts[k],t=STATE.targets[k];
    verd+='<div class="arow"><span>'+esc(STATE.crews[k].name)+': '+(v?v.outcome.toUpperCase()+' ('+fmtN(v.raw)+'/'+fmtN(v.target)+')':'open')+' &middot; target '+(t?fmtN(t.target)+' locked':'not locked')+(STATE.hold[k]?' &middot; HOLD':'')+'</span></div>'
      +'<div class="cr-row"><button class="btn ghost" onclick="admReopen(\''+k+'\')">REOPEN VERDICT</button><button class="btn ghost" onclick="admRelease(\''+k+'\')">RELEASE HOLD</button><button class="btn ghost" onclick="admClearTarget(\''+k+'\')">CLEAR TARGET</button></div>';
  });
  body.innerHTML=
   (FOREIGN?'<div class="as"><div class="ast">&gt; SET UP THE HOTEL</div><div class="small">data/state.json holds a different challenge. Initializing archives it to backups/ first, then writes a clean 13th Floor state.</div><button class="btn danger block" onclick="admInit()">INITIALIZE 13TH FLOOR</button></div>':'')
  +'<div class="as"><div class="ast">&gt; LOG / EDIT STEPS (ANY DAY)</div><label class="al">PLAYER</label><select id="admP">'+pOpts+'</select><label class="al">DATE</label><input type="date" id="admD" value="'+chi(now).date+'" min="'+c.start+'" max="'+c.halloween+'"><label class="al">STEPS (0 CLEARS THE DAY)</label><input type="number" id="admV" min="0" placeholder="e.g. 12500"><button class="btn block" onclick="admLog()">SAVE STEPS</button></div>'
  +'<div class="as"><div class="ast">&gt; POSSESSION</div><div class="small">Picks are drawn at the 7:00 AM reveal. Nothing exists ahead of time. Override a past day or fill a stuck one here.</div>'+reveals
    +'<label class="al">CREW</label><select id="admRC" onchange="admFillRP()">'+cOpts+'</select><label class="al">DAY</label><select id="admRD">'+dOpts+'</select><label class="al">POSSESSED</label><select id="admRP"></select><button class="btn block" onclick="admSetReveal()">SET / REPLACE</button></div>'
  +'<div class="as"><div class="ast">&gt; DOORS</div>'+doors+'</div>'
  +'<div class="as"><div class="ast">&gt; VERDICTS &amp; TARGETS</div>'+verd+'</div>'
  +'<div class="as"><div class="ast">&gt; CONFIG (DERIVED LIVE, SAFE TO TUNE)</div><div class="grid2">'
    +[['floorSize','FLOOR SIZE'],['unlockSteps','DOOR STEPS / DAY'],['hBase','HALLOWEEN BASE'],['hMin','TARGET MIN'],['hMax','TARGET MAX'],['bonusCap','BONUS CAP']].map(([k,l])=>'<div><label class="al">'+l+'</label><input type="number" id="cfg_'+k+'" value="'+c[k]+'"></div>').join('')
    +'</div><button class="btn block" onclick="admConfig()">SAVE CONFIG</button><div class="small" style="margin-top:6px">A locked Halloween target and opened doors do not change. Use CLEAR TARGET to re-lock one.</div></div>'
  +'<div class="as"><div class="ast">&gt; BACKUPS</div><button class="btn ghost block" onclick="admBackupNow()">BACKUP NOW</button><button class="btn ghost block" onclick="admListBackups()">LIST BACKUPS</button><div id="admBakList"></div></div>'
  +'<div class="as"><div class="ast">&gt; DANGER ZONE</div><button class="btn danger block" onclick="admResetAll()">RESET ENTIRE CHALLENGE</button></div>'
  +'<div class="am" id="adminMsg"></div>';
  restoreForm(body,snap);admFillRP();restoreForm(body,snap);
}
function climbDaysList(){return dateRange(cfg(STATE).start,cfg(STATE).climbEnd);}
function admFillRP(){
  const ck=(document.getElementById('admRC')||{}).value;if(!ck)return;
  document.getElementById('admRP').innerHTML=STATE.crews[ck].members.map(p=>'<option value="'+p+'">'+playerMeta(p).display+'</option>').join('');
}
async function admAct(fn,msg,okText){
  setAdminMsg('SAVING...','');
  const res=await commit(fn,msg);
  setAdminMsg(res.ok?(okText||'SAVED'):res.error,res.ok?'ok':'err');
  if(res.ok)renderAdmin();
  return res;
}
function admLog(){
  const pid=document.getElementById('admP').value,date=document.getElementById('admD').value,val=Number(document.getElementById('admV').value);
  if(!pid){setAdminMsg('PICK A PLAYER FIRST','err');return;}
  if(!date||!Number.isFinite(val)||val<0||val>150000||Math.floor(val)!==val){setAdminMsg('INVALID ENTRY','err');return;}
  admAct(s=>{if(val===0)delete s.players[pid].steps[date];else s.players[pid].steps[date]=val;},'admin steps: '+pid+' '+date+'='+val).then(r=>{if(r&&r.ok){const e=document.getElementById('admV');if(e)e.value='';}});
}
function admSetReveal(){
  const ck=document.getElementById('admRC').value,d=document.getElementById('admRD').value,p=document.getElementById('admRP').value;
  admAct(s=>{s.reveals[ck][d]={player:p,at:new Date().toISOString(),admin:true};},'admin possession '+ck+' '+d);
}
function admRemoveReveal(ck,d){if(!confirm('Remove the '+fmtDay(d)+' possession? It will be redrawn at the next check if everyone has logged.'))return;admAct(s=>{delete s.reveals[ck][d];},'admin remove possession '+ck+' '+d);}
function admDoor(ck,L,open){admAct(s=>{if(open)s.doors[ck][L]={day:'admin',at:new Date().toISOString()};else delete s.doors[ck][L];},'admin door '+ck+' '+L);}
function admReopen(ck){if(!confirm('Reopen this verdict and hold it open until released?'))return;admAct(s=>{s.verdicts[ck]=null;s.hold[ck]=true;},'admin reopen verdict '+ck);}
function admRelease(ck){admAct(s=>{s.hold[ck]=false;},'admin release hold '+ck);}
function admClearTarget(ck){if(!confirm('Clear the locked target? It re-locks at the next check once the 10/30 reveal exists.'))return;admAct(s=>{s.targets[ck]=null;s.verdicts[ck]=null;},'admin clear target '+ck);}
function admConfig(){
  const keys=['floorSize','unlockSteps','hBase','hMin','hMax','bonusCap'],vals={};
  for(const k of keys){const n=Number(document.getElementById('cfg_'+k).value);if(!Number.isFinite(n)||n<0){setAdminMsg('INVALID '+k,'err');return;}vals[k]=n;}
  admAct(s=>{s.config=Object.assign(s.config||{},vals);},'admin config','CONFIG SAVED');
}
async function admBackupNow(){setAdminMsg('BACKING UP...','');try{const ok=await writeBackup(stampNow(NOW()),STATE);setAdminMsg(ok?'BACKUP SAVED':'BACKUP FAILED',ok?'ok':'err');}catch(e){setAdminMsg('BACKUP FAILED: '+e.message,'err');}}
async function admListBackups(){
  setAdminMsg('LOADING...','');
  const list=await listBackups(),el=document.getElementById('admBakList');
  el.innerHTML=list.slice().reverse().map(f=>'<div class="bak-row"><span>'+esc(f.name)+'</span><button onclick="admRestore(\''+f.path+'\')">RESTORE</button></div>').join('')||'<div class="small">No backups yet.</div>';
  setAdminMsg('','');
}
async function admRestore(path){
  if(!confirm('Restore from '+path+'? Reveals, opened doors and verdicts already on record are kept. A backup of the current state is taken first.'))return;
  setAdminMsg('RESTORING...','');
  try{const res=await restoreBackup(path);setAdminMsg(res.ok?'RESTORED':res.error,res.ok?'ok':'err');}
  catch(e){setAdminMsg(e.message,'err');}
}
async function admInit(){
  if(!confirm('Archive the current state.json to backups/ and start a clean 13th Floor?'))return;
  setAdminMsg('INITIALIZING...','');
  try{
    const f=await ghGetFile(GH_STATE_PATH);
    if(f){await ghPutRaw(GH_BAK_DIR+'/pre-13th-floor-'+stampNow(NOW())+'.json',JSON.parse(f.content),null,'archive previous challenge state');}
    const r=await ghPutRaw(GH_STATE_PATH,defState(),f?f.sha:null,'initialize 13th Floor');
    if(!r.ok)throw new Error('GitHub '+r.status);
    FOREIGN=false;STATE=null;await boot();setAdminMsg('HOTEL INITIALIZED','ok');
  }catch(e){setAdminMsg('FAILED: '+e.message,'err');}
}
async function admResetAll(){
  if(!confirm('Reset the ENTIRE challenge? All steps, reveals, doors and verdicts are wiped.'))return;
  if(!confirm('Really sure? A backup is saved first, but the live dashboard resets for everyone.'))return;
  setAdminMsg('RESETTING...','');
  try{await writeBackup('pre-13th-floor-'+stampNow(NOW()),STATE);}catch(e){}
  const res=await commit(()=>defState(),'RESET challenge');
  setAdminMsg(res.ok?'CHALLENGE RESET':res.error,res.ok?'ok':'err');
  if(res.ok)renderAdmin();
}

boot();
</script>
</body>
</html>
